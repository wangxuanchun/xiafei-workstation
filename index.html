// PULL — read gist, apply remote if newer than last sync
// Universal merge by key: remote wins for same key, local-only keys preserved
// Remote order is preserved; local-only items appended at end
// Works for arrays (keyFn extracts key from each item) and plain objects (property names are keys)
function mergeByKey(local, remote, keyFn){
  if(!remote) return local||[];
  if(!local) return remote;
  // Object merge: property names are the merge keys, remote overrides
  if(!Array.isArray(local) && !Array.isArray(remote)){
    return Object.assign({...local}, remote);
  }
  // Array merge: remote order first, then local-only items appended
  const map=new Map();
  const localKeys=new Set();
  (local||[]).forEach(x=>{ const k=keyFn(x); if(k!=null){ map.set(k,x); localKeys.add(k); } });
  const result=[];
  const seen=new Set();
  // Remote items in their order (remote wins for same key)
  (remote||[]).forEach(r=>{ const k=keyFn(r); if(k!=null){ result.push(r); seen.add(k); } });
  // Local-only items appended at end
  (local||[]).forEach(x=>{ const k=keyFn(x); if(k!=null && !seen.has(k)) result.push(x); });
  return result;
}
// Deduplicate categories by name — keeps the one with an image, or the first occurrence
function dedupeCategories(cats){
  if(!cats || !cats.length) return cats;
  const seen=new Map();
  cats.forEach(c=>{
    const key=(c.name||'').trim();
    if(!key) return;
    if(!seen.has(key)){
      seen.set(key, c);
    } else {
      const prev=seen.get(key);
      // prefer the one that has an image
      if(!prev.image && c.image) seen.set(key, c);
    }
  });
  return [...seen.values()];
}
// Deduplicate recipes by name within the same category — keeps the one with more content
function dedupeRecipes(recipes){
  if(!recipes || !recipes.length) return recipes;
  const seen=new Map();
  recipes.forEach(r=>{
    const key=(r.cat||'')+'|'+(r.name||'').trim();
    if(!seen.has(key)){
      seen.set(key, r);
    } else {
      const prev=seen.get(key);
      const prevLen=(prev.steps||'').length+(prev.ingredients||[]).length;
      const curLen=(r.steps||'').length+(r.ingredients||[]).length;
      if(curLen>prevLen) seen.set(key, r);
    }
  });
  return [...seen.values()];
}

async function syncPull(silent){
  if(!syncConfigured()) return false;
  try{
    const backend = syncBackend();
    let remote = null;
    if(backend==='gitee'){
      const parts = state.sync.giteeRepo.split('/');
      const owner = parts[0] || state.sync.giteeOwner || '';
      const repo = parts[1] || parts[0] || '';
      const result = await giteeReadFile(state.sync.giteeToken, owner, repo);
      remote = result ? result.data : null;
    }else throw new Error('当前仅启用国内同步后端，请连接 Gitee 同步');
    if(!remote || !remote.recipes){
      // cloud empty but local empty too → seed
      if(!state.recipes.length){
        state.recipes = seedRecipes();
        state.sync.localUpdatedAt = Date.now();
        writeLocal(); scheduleSyncPush();
      }
      return false;
    }
    const remoteTs = remote.updatedAt || 0;
    if(remoteTs > state.sync.lastSyncedAt){
      const localHasChanges = state.sync.localUpdatedAt > state.sync.lastSyncedAt;

      // Universal merge by key for ALL data types (remote wins for same key)
      // Recipes: merge by id
      state.recipes = mergeByKey(state.recipes, remote.recipes, x=>x.id);
      // Categories: merge by id
      state.categories = mergeByKey(state.categories, remote.categories, x=>x.id);
      // Deduplicate after merge (same name, different id → keep one)
      state.categories = dedupeCategories(state.categories);
      state.recipes = dedupeRecipes(state.recipes);
      // Showcases: merge by id
      state.showcases = mergeByKey(state.showcases, remote.showcases, x=>x.id);
      // Group order: remote wins if present
      if(remote.groupOrder && Array.isArray(remote.groupOrder) && remote.groupOrder.length>0){
        state.groupOrder = remote.groupOrder;
      }
      // Pantry: merge by value (string itself is the key)
      state.pantry = mergeByKey(state.pantry, remote.pantry, x=>x);
      // Wiki: merge by property name (object)
      state.wiki = mergeByKey(state.wiki, remote.wiki);
      // Settings: remote wins
      if(remote.aiImage) state.aiImage = Object.assign({...DEFAULT_AI}, remote.aiImage);
      // Profile: sync name/tagline but preserve device-local avatar
      if(remote.profile){
        const localAvatar = state.profile.avatar;
        state.profile = Object.assign({...DEFAULT_PROFILE}, remote.profile);
        state.profile.avatar = localAvatar;
      }

      // Repair any garbled text that came from cloud
      repairAllData();
      // Ensure wiki ingredients exist
      ensureWikiIngredients();
      // Migrate categories to new grouped Chinese structure
      migrateCategories();
      // Migrate recipe cat fields: old English keys → Chinese category IDs
      migrateRecipeCats();
      // Ensure reference recipes exist (after categories are migrated)
      ensureReferenceRecipes();
      // Set category images by name
      migrateCategoryImages()
    migrateRecipeImages();
      // Re-lock recipes after cloud merge (cloud data may lack 'locked' field)
      let relockChanged=false;
      if(state.recipes && state.recipes.length>0){
        state.recipes.forEach(r=>{
          if(r.locked===undefined){
            r.locked=true;
            r.lockPwd=r.lockPwd||DEFAULT_RECIPE_PWD;
            relockChanged=true;
          }
        });
        if(relockChanged){
          state.sync.localUpdatedAt=Date.now();
          writeLocal();
        }
      }

      state.sync.lastSyncedAt = remoteTs;

      if(localHasChanges){
        // Local also has changes → mark as needing push to upload local-only items
        state.sync.localUpdatedAt = Date.now();
        writeLocal();
        render();
        if(!silent) toast('✓ 已合并云端数据','success');
        updateSyncStatusUI();
        scheduleSyncPush();
        return true;
      }

      // No local changes → fully synced
      // But if migrations/repairs changed data, push fixes to cloud
      const migrated = (state.sync.localUpdatedAt > remoteTs);
      if(!migrated) state.sync.localUpdatedAt = remoteTs;
      writeLocal();
      render();
      if(!silent) toast(migrated ? '✓ 已从云端同步并修复数据' : '✓ 已从云端同步','success');
      updateSyncStatusUI();
      if(migrated) scheduleSyncPush();
      return true;
    }
    updateSyncStatusUI();
    return false;
  }catch(e){
    console.warn('pull failed',e);
    if(!silent) toast('云同步失败：'+e.message,'error');
    return false;
  }
}
// Repair garbled UTF-8 text (caused by double encoding bug)
// Detects mojibake like "Ã¥Â·Â´", "æ²¹è´¨ç±»", "ç²¾ç±»" and converts back to correct Chinese
function repairText(s){
  if(typeof s!=='string' || !s) return s;
  // Check if text looks like garbled UTF-8 (2+ consecutive high chars 0x80-0xFF or Latin Extended-A 0x100-0x17F)
  // This covers: Ã, Â, æ, è, ç, å (0xC0-0xFF) AND Ā, ā, Ă (0x100-0x17F) mojibake patterns
  if(!/[\u0080-\u017F]{2,}/.test(s)) return s;
  try{
    const repaired = decodeURIComponent(escape(s));
    // Verify the repaired text has CJK or common characters (confirms it was garbled)
    if(/[\u4e00-\u9fff\u3000-\u303f]/.test(repaired)) return repaired;
  }catch(e){}
  return s;
}
// Repair all text fields in the state data
function repairAllData(){
  let fixed=false;
  function tryFix(val){
    if(typeof val==='string'){
      const r=repairText(val);
      if(r!==val){ fixed=true; return r; }
    }
    return val;
  }
  // Repair recipes
  state.recipes.forEach(r=>{
    if(r.name) r.name=tryFix(r.name);
    if(r.desc) r.desc=tryFix(r.desc);
    if(r.ingredients) r.ingredients=tryFix(r.ingredients);
    if(r.steps) r.steps=tryFix(r.steps);
    if(r.tips) r.tips=tryFix(r.tips);
  });
  // Repair categories
  state.categories.forEach(c=>{
    if(c.name) c.name=tryFix(c.name);
  });
  // Repair showcases
  state.showcases.forEach(s=>{
    if(s.name) s.name=tryFix(s.name);
    if(s.desc) s.desc=tryFix(s.desc);
  });
  // Repair wiki (fix both keys and item fields)
  if(state.wiki){
    const newWiki={};
    for(const k in state.wiki){
      const repairedKey=tryFix(k);
      const items=state.wiki[k];
      if(items && Array.isArray(items.items)){
        items.items.forEach(it=>{
          if(it.n) it.n=tryFix(it.n);
          if(it.d) it.d=tryFix(it.d);
        });
      }
      newWiki[repairedKey]=items;
    }
    state.wiki=newWiki;
  }
  // Repair pantry
  state.pantry=state.pantry.map(p=>tryFix(p));
  // Repair profile
  if(state.profile.name) state.profile.name=tryFix(state.profile.name);
  if(state.profile.tagline) state.profile.tagline=tryFix(state.profile.tagline);
  if(fixed){
    state.sync.localUpdatedAt=Date.now();
    writeLocal();
  }
  return fixed;
}
// full bidirectional sync — repair local, pull first (merge remote), then push
async function syncNow(silent){
  if(!syncConfigured()){ if(!silent) toast('请先连接云同步','error'); return; }
  // Step 1: repair any garbled text in local data
  const repaired = repairAllData();
  if(repaired && !silent) toast('已修复乱码数据','success');
  // Step 2: pull from cloud first (merge remote changes into local)
  await syncPull(true);
  // Step 3: repair again (fix any garbled text that came from cloud)
  repairAllData();
  // Step 4: push merged local data to cloud
  state.sync.localUpdatedAt = Date.now();
  await syncPush(true);
  state.sync.lastSyncedAt = Date.now();
  writeLocal();
  // Step 5: re-render to reflect merged data
  render();
  if(!silent) toast('✓ 同步完成','success');
  updateSyncStatusUI();
}
// debounced auto-push after local edits (3s idle)
let pushTimer=null, pushingGuard=false;
function scheduleSyncPush(){
  if(!syncConfigured() || !state.sync.autoSync) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ syncPush(true); }, 3000);
}
function fmtSyncTime(ts){
  if(!ts) return '从未';
  const d=new Date(ts), now=new Date();
  const diff=Math.floor((now-d)/60000);
  if(diff<1) return '刚刚';
  if(diff<60) return diff+'分钟前';
  if(diff<1440) return Math.floor(diff/60)+'小时前';
  return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
function fmtDeviceOnlineTime(ts){
  if(!ts) return '未知';
  const d=new Date(ts), now=new Date();
  const diff=Math.floor((now-d)/60000);
  if(diff<1) return '刚刚';
  if(diff<60) return diff+'分钟前';
  if(diff<1440) return Math.floor(diff/60)+'小时前';
  const days=Math.floor(diff/1440);
  if(days<30) return days+'天前';
  const months=Math.floor(days/30);
  if(months<12) return months+'个月前';
  return Math.floor(months/12)+'年前';
}
function updateSyncStatusUI(){
  const el=document.getElementById('syncStatusLine');
  if(el) el.textContent = syncConfigured()
    ? '上次同步 '+fmtSyncTime(state.sync.lastSyncedAt)
    : '未连接';
}

/* ---------- Toast ---------- */
let toastTimer=null, errorTimer=null;
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=''; 
  // force reflow then show
  void t.offsetWidth;
  t.className='show '+type;
  clearTimeout(toastTimer);
  const dur = type==='success' ? 1500 : 3000;
  toastTimer=setTimeout(()=>{ t.classList.remove('show'); },dur);
}

  if(diff<=0) return '今天更新';

  return '更新于 '+d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'});
}

// Generic row drag-to-reorder (for large category sort)
function initRowDrag(container, rowSelector, attrName){
  let dragRow=null, ghost=null, isDragging=false;
  let startY=0, offsetX=0, offsetY=0;
  const HOLD_MS=300;
  let holdTimer=null;

  function getRowAtPoint(y){
    const rows = [...container.querySelectorAll(rowSelector)];
    for(const r of rows){
      if(r===dragRow) continue;
      const rect = r.getBoundingClientRect();
      if(y>=rect.top && y<=rect.bottom) return r;
    }
    return null;
  }

  function beginDrag(row, x, y){
    isDragging=true;
    dragRow=row;
    const rect=row.getBoundingClientRect();
    offsetX = x - rect.left;
    offsetY = y - rect.top;
    row.classList.add('placeholder');
    // Create ghost
    ghost = row.cloneNode(true);
    ghost.classList.remove('placeholder');
    ghost.classList.add('dragging');
    ghost.style.width=rect.width+'px';
    ghost.style.left=rect.left+'px';
    ghost.style.top=rect.top+'px';
    document.body.appendChild(ghost);
    if(navigator.vibrate) navigator.vibrate(20);
  }

  function moveDrag(x, y){
    if(!ghost) return;
    ghost.style.left=(x-offsetX)+'px';
    ghost.style.top=(y-offsetY)+'px';
    // Find target row to swap
    const target=getRowAtPoint(y);
    // Remove highlight from all
    container.querySelectorAll(rowSelector+'.placeholder').forEach(r=>{
      if(r!==dragRow) r.classList.remove('placeholder');
    });
    if(target && target!==dragRow){
      // Insert dragRow before or after target based on position
      const rows=[...container.querySelectorAll(rowSelector)];
      const dragIdx=rows.indexOf(dragRow);
      const targetIdx=rows.indexOf(target);
      if(targetIdx < dragIdx){
        target.parentNode.insertBefore(dragRow, target);
      } else {
        target.parentNode.insertBefore(dragRow, target.nextSibling);
      }
    }
  }

  function endDrag(){
    if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
    if(!isDragging){ return; }
    isDragging=false;
    if(dragRow) dragRow.classList.remove('placeholder');
    if(ghost){
      const rect=dragRow.getBoundingClientRect();
      ghost.style.transition='left .25s cubic-bezier(.2,.9,.3,1), top .25s cubic-bezier(.2,.9,.3,1), opacity .25s ease';
      ghost.style.left=rect.left+'px';
      ghost.style.top=rect.top+'px';
      ghost.style.opacity='0';
      setTimeout(()=>{ if(ghost){ghost.remove();ghost=null;} },250);
    }
    dragRow=null;
    document.removeEventListener('mousemove',onMouseMove);
    document.removeEventListener('mouseup',onMouseUp);
    document.removeEventListener('touchmove',onTouchMove);
    document.removeEventListener('touchend',onTouchEnd);
    document.removeEventListener('touchcancel',onTouchEnd);
  }

  function onMouseMove(e){ if(!isDragging) return; e.preventDefault(); moveDrag(e.clientX,e.clientY); }
  function onMouseUp(){ endDrag(); }
  function onTouchMove(e){ if(!isDragging) return; e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX,t.clientY); }
  function onTouchEnd(){ endDrag(); }

  container.querySelectorAll(rowSelector).forEach(row=>{
    // Mouse
    row.addEventListener('mousedown',(e)=>{
      if(e.button!==0) return;
      holdTimer=setTimeout(()=>{
        beginDrag(row, e.clientX, e.clientY);
        document.addEventListener('mousemove',onMouseMove);
        document.addEventListener('mouseup',onMouseUp);
      },HOLD_MS);
    });
    row.addEventListener('mouseup',()=>{ if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} });
    // Touch
    row.addEventListener('touchstart',(e)=>{
      const t=e.touches[0];
      holdTimer=setTimeout(()=>{
        beginDrag(row, t.clientX, t.clientY);
        document.addEventListener('touchmove',onTouchMove,{passive:false});
        document.addEventListener('touchend',onTouchEnd);
        document.addEventListener('touchcancel',onTouchEnd);
      },HOLD_MS);
    },{passive:true});
    row.addEventListener('touchmove',()=>{ if(holdTimer && !isDragging){clearTimeout(holdTimer);holdTimer=null;} },{passive:true});
    row.addEventListener('touchend',()=>{ if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} });
  });
}

function initCardSortDrag(){
  const cards = document.querySelectorAll('.cat.shaking');
  if(!cards.length) return;
  let dragCard=null, ghost=null, isDragging=false;
  let startX=0, startY=0, offsetX=0, offsetY=0;
  const HOLD_MS=400;
  let holdTimer=null;

  function getCardAtPoint(x, y){
    if(ghost) ghost.style.display='none';
    const el=document.elementFromPoint(x, y);
    if(ghost) ghost.style.display='';
    if(el){
      const card=el.closest('.cat');
      if(card && card!==dragCard && card.classList.contains('shaking')) return card;
    }
    return null;
  }

  function beginDrag(card, x, y){
    isDragging=true;
    dragCard=card;
    card.classList.add('sort-placeholder');
    card.classList.remove('shaking');
    const rect=card.getBoundingClientRect();
    offsetX=x-rect.left;
    offsetY=y-rect.top;
    // Create ghost
    ghost=card.cloneNode(true);
    ghost.classList.remove('sort-placeholder');
    ghost.classList.remove('shaking');
    ghost.classList.add('sort-dragging');
    ghost.style.width=rect.width+'px';
    ghost.style.height=rect.height+'px';
    ghost.style.left=rect.left+'px';
    ghost.style.top=rect.top+'px';
    document.body.appendChild(ghost);
    if(navigator.vibrate) navigator.vibrate(30);
  }

  function moveDrag(x, y){
    if(!ghost) return;
    ghost.style.left=(x-offsetX)+'px';
    ghost.style.top=(y-offsetY)+'px';
    const target=getCardAtPoint(x, y);
    // Remove highlight
    document.querySelectorAll('.cat.sort-placeholder').forEach(c=>{ if(c!==dragCard) c.classList.remove('sort-placeholder'); });
    if(target){
      target.classList.add('sort-placeholder');
      // Swap in DOM
      const allGrids=[...document.querySelectorAll('.grid')];
      for(const grid of allGrids){
        const rows=[...grid.querySelectorAll('.cat')];
        const dragIdx=rows.indexOf(dragCard);
        const targetIdx=rows.indexOf(target);
        if(dragIdx>=0 && targetIdx>=0){
          if(targetIdx<dragIdx) grid.insertBefore(dragCard, target);
          else grid.insertBefore(dragCard, target.nextSibling);
          break;
        }
      }
    }
  }

  function endDrag(){
    if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
    if(!isDragging) return;
    isDragging=false;
    if(dragCard){
      dragCard.classList.remove('sort-placeholder');
      dragCard.classList.add('shaking');
    }
    if(ghost){
      const rect=dragCard.getBoundingClientRect();
      ghost.style.transition='left .25s cubic-bezier(.2,.9,.3,1), top .25s cubic-bezier(.2,.9,.3,1), opacity .25s ease, transform .25s ease';
      ghost.style.left=rect.left+'px';
      ghost.style.top=rect.top+'px';
      ghost.style.transform='scale(1)';
      ghost.style.opacity='0';
      setTimeout(()=>{ if(ghost){ghost.remove();ghost=null;} },250);
    }
    dragCard=null;
    document.removeEventListener('mousemove',onMouseMove);
    document.removeEventListener('mouseup',onMouseUp);
    document.removeEventListener('touchmove',onTouchMove);
    document.removeEventListener('touchend',onTouchEnd);
    document.removeEventListener('touchcancel',onTouchEnd);
  }

  function onMouseMove(e){ if(!isDragging) return; e.preventDefault(); moveDrag(e.clientX,e.clientY); }
  function onMouseUp(){ endDrag(); }
  function onTouchMove(e){ if(!isDragging) return; e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX,t.clientY); }
  function onTouchEnd(){ endDrag(); }

  cards.forEach(card=>{
    const art = card.querySelector('.art');
    const target = art || card;
    // Mouse
    target.addEventListener('mousedown',(e)=>{
      if(e.button!==0) return;
      holdTimer=setTimeout(()=>{
        beginDrag(card, e.clientX, e.clientY);
        document.addEventListener('mousemove',onMouseMove);
        document.addEventListener('mouseup',onMouseUp);
      },HOLD_MS);
    });
    target.addEventListener('mouseup',()=>{ if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} });
    // Touch
    target.addEventListener('touchstart',(e)=>{
      const t=e.touches[0];
      holdTimer=setTimeout(()=>{
        beginDrag(card, t.clientX, t.clientY);
        document.addEventListener('touchmove',onTouchMove,{passive:false});
        document.addEventListener('touchend',onTouchEnd);
        document.addEventListener('touchcancel',onTouchEnd);
      },HOLD_MS);
    },{passive:true});
    target.addEventListener('touchmove',()=>{ if(holdTimer && !isDragging){clearTimeout(holdTimer);holdTimer=null;} },{passive:true});
    target.addEventListener('touchend',()=>{ if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} });
  });
}

// Step 2: Download image and convert to base64；不再使用海外 CORS 代理。
async function fetchImageAsBase64(imageUrl){
  try{
    const resp=await fetch(imageUrl,{mode:'cors'});
    if(resp.ok){
      const blob=await resp.blob();
      return await new Promise((resolve)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.readAsDataURL(blob); });

  }catch(e){ /* fall through */ }

// Step 3: Edit image with wanx2.1-imageedit (async task) — keep subject, change style only
async function editImageWithReference(base64Image){
  const stylePrompt='Apply warm beige color tones, soft natural diffused lighting, vintage polaroid film grain texture, slight vignette, cozy and appetizing atmosphere. Keep the food subject completely unchanged — do not alter shape, position, or identity. Only modify lighting, color tone, and overall mood.';
  const body={
    model:'wanx2.1-imageedit',
    input:{
      prompt:stylePrompt,
      function:'description_edit',
      base_image_url:base64Image
    },
    parameters:{ strength:0.35, n:1, watermark:false }
  };
  // Create async task
  const resp=await fetch('https://dashscope.aliyuncs.com/api/v1/services/aigc/image2image/image-synthesis',{
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+state.aiImage.apiKey, 'X-DashScope-Async':'enable' },
    body:JSON.stringify(body)
  });
  const data=await resp.json();
  if(data.code) throw new Error(data.message||'图像编辑请求失败');
  const taskId=data.output?.task_id;
  if(!taskId) throw new Error('未获取到任务ID');
  // Poll for result
  return await pollTaskResult(taskId);
}

// Poll async task until completion
async function pollTaskResult(taskId){
  const maxAttempts=30;
  for(let i=0;i<maxAttempts;i++){
    await new Promise(r=>setTimeout(r,3000));
    const resp=await fetch('https://dashscope.aliyuncs.com/api/v1/tasks/'+taskId,{
      headers:{ 'Authorization':'Bearer '+state.aiImage.apiKey }
    });
    const data=await resp.json();
    const status=data.output?.task_status;
    if(status==='SUCCEEDED'){
      const imageUrl=data.output?.results?.[0]?.url;
      if(!imageUrl) throw new Error('未获取到结果图片');
      return imageUrl;
    }
    if(status==='FAILED') throw new Error(data.output?.message||'图像编辑失败');
  }
  throw new Error('处理超时，请重试');
}

/* ---------- Image compression helpers ---------- */
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('图片读取失败'));
    reader.readAsDataURL(file);
  });
}
function compressImageDataUrl(dataUrl, options={}){
  const maxSize=options.maxSize||800;
  const quality=options.quality||0.72;
  const square=!!options.square;
  const warm=options.warm!==false;
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let width=img.width, height=img.height;
        let sx=0, sy=0, sw=img.width, sh=img.height;
        if(square){
          const minDim=Math.min(img.width,img.height);
          sx=(img.width-minDim)/2; sy=(img.height-minDim)/2; sw=minDim; sh=minDim;
          width=maxSize; height=maxSize;
        }else{
          const scale=Math.min(1, maxSize/Math.max(img.width,img.height));
          width=Math.max(1, Math.round(img.width*scale));
          height=Math.max(1, Math.round(img.height*scale));
        }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,sx,sy,sw,sh,0,0,width,height);
        if(warm){
          ctx.globalCompositeOperation='multiply';
          ctx.fillStyle='rgba(255,240,225,.10)';
          ctx.fillRect(0,0,width,height);
          ctx.globalCompositeOperation='source-over';
        }
        resolve(canvas.toDataURL('image/jpeg',quality));
      }catch(err){ reject(err); }
    };
    img.onerror=()=>reject(new Error('图片加载失败'));
    img.src=dataUrl;
  });
}
async function compressImageFile(file, options={}){
  if(!file) throw new Error('未选择图片');
  if(file.size>20*1024*1024) throw new Error('图片不能超过20MB');
  const dataUrl=await fileToDataURL(file);
  return await compressImageDataUrl(dataUrl, options);
}

/* ---------- Image processor: center-crop + subtle warm tone ---------- */
function processCatImage(dataUrl, callback){
  compressImageDataUrl(dataUrl,{maxSize:720,quality:.78,square:true,warm:true})
    .then(callback)
    .catch(()=>toast('图片处理失败，请重试','error'));
}

/* ---------- Batch auto-fill category images ---------- */
async function autoFillCategoryImages(){
  const missing = state.categories.filter(c=>!c.image);
  if(missing.length===0){ toast('所有分类都已有图片','info'); return; }
  if(!state.aiImage.apiKey){
    openActionSheet('补充图片','需要配置AI图片API密钥才能自动搜索并生成统一风格图片',[
      {label:'手动搜索',action:()=>{
        // Fallback: search without AI style edit (just search + process)
        autoFillSimple(missing);
      }},
      {label:'取消'}
    ]);
    return;
  }
  toast(`开始搜索 ${missing.length} 个分类图片...`,'info');
  let done=0, failed=0;
  for(const cat of missing){
    try{
      const query = cat.nameEn || cat.name;
      const results = await searchFoodImages(query);
      if(results.length>0){
        // Pick the first result
        const imgUrl = results[0].url;
        let finalImage;
        try{
          // Try AI style edit first
          const base64 = await fetchImageAsBase64(imgUrl);
          if(state.aiImage.apiKey){
            const editedUrl = await editImageWithReference(base64);
            finalImage = await downloadAndProcessAI(editedUrl);
          } else {
            finalImage = await downloadAndProcessAI(imgUrl);
          }
        }catch(e){
          // Fallback: just download and process without AI edit
          finalImage = await downloadAndProcessAI(imgUrl);
        }
        cat.image = finalImage;
        done++;
        toast(`已补充 ${done}/${missing.length}: ${cat.name}`,'success');
      } else {
        failed++;
      }
    }catch(e){
      console.warn('autoFill error for',cat.name,e);
      failed++;
    }
    // Small delay between requests
    await new Promise(r=>setTimeout(r,500));
  }
  if(done>0){
    persist(true);
    renderGalleryHome();
    toast(`完成！成功补充 ${done} 个图片${failed>0?'，'+failed+'个失败':''}`,'success');
  } else {
    toast('搜索失败，请检查网络或稍后重试','error');
  }
}
// Simple auto-fill without AI style edit (fallback when no API key)
async function autoFillSimple(missing){
  toast(`开始搜索 ${missing.length} 个分类图片（简化模式）...`,'info');
  let done=0;
  for(const cat of missing){
    try{
      const results = await searchFoodImages(cat.nameEn || cat.name);
      if(results.length>0){
        const finalImage = await downloadAndProcessAI(results[0].url);
        cat.image = finalImage;
        done++;
        toast(`已补充 ${done}/${missing.length}: ${cat.name}`,'success');
      }
    }catch(e){ console.warn('simple fill error',cat.name,e); }
    await new Promise(r=>setTimeout(r,500));
  }
  if(done>0){ persist(true); renderGalleryHome(); toast(`完成！成功补充 ${done} 个图片`,'success'); }
  else{ toast('搜索失败','error'); }
}

function openSearchModal(initialQuery, onConfirm){
  let searchResults=[];
  let selectedUrl=null;

  const overlay=document.createElement('div');
  overlay.className='sm-overlay';
  overlay.innerHTML=`<div class="sm-sheet">
    <div class="sm-header">
      <div class="sm-title">AI 搜索参考图</div>
      <button class="sm-close" id="smClose">✕</button>
    </div>
    <div class="sm-search-row">
      <input type="text" id="smInput" value="${esc(initialQuery)}" placeholder="输入食物名称搜索">
      <button id="smSearchBtn">搜索</button>
    </div>
    <div class="sm-content" id="smContent">
      <div class="sm-loading"><div class="spinner"></div>正在搜索「${esc(initialQuery)}」...</div>
    </div>
    <div class="sm-footer">
      <button class="sm-cancel" id="smCancel">取消</button>
      <button class="sm-confirm" id="smConfirm" disabled>生成统一风格</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const content=overlay.querySelector('#smContent');
  const confirmBtn=overlay.querySelector('#smConfirm');
  const searchBtn=overlay.querySelector('#smSearchBtn');
  const input=overlay.querySelector('#smInput');

  // Close
  overlay.querySelector('#smClose').onclick=()=>overlay.remove();
  overlay.querySelector('#smCancel').onclick=()=>overlay.remove();

  // Search function
  async function doSearch(query){
    searchBtn.disabled=true;
    content.innerHTML='<div class="sm-loading"><div class="spinner"></div>正在搜索「'+esc(query)+'」...</div>';
    selectedUrl=null;
    confirmBtn.disabled=true;
    try{
      searchResults=await searchFoodImages(query);
      let gridHtml='<div class="sm-grid">';
      searchResults.forEach(r=>{
        gridHtml+=`<div class="sm-grid-item" data-url="${esc(r.url)}"><img src="${esc(r.thumb)}" alt="${esc(r.title)}" onerror="this.parentElement.style.display='none'"></div>`;
      });
      gridHtml+='</div>';
      gridHtml+=`<button class="sm-xhs-btn" id="smXhs">📱 在小红书中搜索「${esc(query)}」</button>`;
      content.innerHTML=gridHtml;
      // Bind image selection
      content.querySelectorAll('.sm-grid-item').forEach(item=>{
        item.onclick=()=>{
          content.querySelectorAll('.sm-grid-item').forEach(i=>i.classList.remove('selected'));
          item.classList.add('selected');
          selectedUrl=item.dataset.url;
          confirmBtn.disabled=false;
        };
      });
      // XHS search button
      const xhsBtn=content.querySelector('#smXhs');
      if(xhsBtn){
        xhsBtn.onclick=()=>window.open('https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(query),'_blank');
      }
    }catch(e){
      let msg=e.message||'搜索失败';
      content.innerHTML='<div class="sm-empty">'+msg+'<br><br>可以尝试：<br>1. 换一个关键词<br>2. <a href="https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(query)+'" target="_blank" style="color:var(--brand)">在小红书中搜索</a> 并手动上传</div>';
    }finally{
      searchBtn.disabled=false;
    }
  }

  // Search button
  searchBtn.onclick=()=>{ const q=input.value.trim(); if(q) doSearch(q); };
  input.onkeydown=(e)=>{ if(e.key==='Enter'){ const q=input.value.trim(); if(q) doSearch(q); } };

  // Confirm → generate
  confirmBtn.onclick=async()=>{
    if(!selectedUrl) return;
    confirmBtn.disabled=true;
    // Show generation overlay
    const genOverlay=document.createElement('div');
    genOverlay.className='sm-gen-overlay';
    genOverlay.innerHTML='<div class="spinner"></div><div class="sm-gen-text">正在生成统一风格图片...<br>保留食物主体，调整光影色调（约15秒）</div>';
    overlay.querySelector('.sm-sheet').style.position='relative';
    overlay.querySelector('.sm-sheet').appendChild(genOverlay);
    try{
      await onConfirm(selectedUrl);
      overlay.remove();
      toast('AI 风格化成功','success');
    }catch(e){
      let msg=e.message||'生成失败';
      if(msg.includes('Failed to fetch')||msg.includes('NetworkError')) msg='网络错误，请检查网络连接';
      else if(msg.includes('401')||msg.includes('Unauthorized')) msg='API Key 无效';
      else if(msg.includes('429')) msg='请求过于频繁，请稍后再试';
      toast('生成失败：'+msg,'error');
      genOverlay.remove();
      confirmBtn.disabled=false;
    }
  };

  // Auto-search on open
  doSearch(initialQuery);
}

function openCatEditor(existing){

  const modal=document.getElementById('modal');
  modal.innerHTML=`<div class="cat-modal">

  const uploadArea=document.getElementById('cmUpload');
  const nameInput=document.getElementById('cmName');
  const imgInput=document.getElementById('catImgInput');

  // image upload — process to match default style (square crop + warm tone)
  uploadArea.onclick=()=>imgInput.click();
  imgInput.onchange=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    try{
      image=await compressImageFile(file,{maxSize:720,quality:.78,square:true,warm:true});
      uploadArea.classList.add('has-img');
      uploadArea.innerHTML=`<img src="${image}" alt=""><span class="up-change">更换图片</span>`;
    }catch(err){
      toast(err.message||'图片处理失败，请重试','error');
    }finally{
      e.target.value='';
    }
  };
  // cancel
  document.getElementById('cmCancel').onclick=()=>{ modal.classList.remove('show'); };
  // ok
  document.getElementById('cmOk').onclick=()=>{
    const val=nameInput.value.trim()||'未命名分类';
    if(isEdit){
      existing.name=val; existing.image=image||'';
      persist(true);
      modal.classList.remove('show');
      renderGalleryHome();
      toast('分类已更新','success');
    }else{
      const newCat={ id:'cat-'+Date.now(), name:val, image:image||'' };
      state.categories.unshift(newCat);
      persist(true);
      modal.classList.remove('show');
      renderGalleryHome();
      toast('分类已创建','success');
    }
  };
}

function renderRecipeList(){
  const cat = state.categories.find(c=>c.id===state.catId);
  const list = state.recipes.filter(r=>r.cat===state.catId).sort((a,b)=>b.updated-a.updated);

  content.innerHTML = `
    <div class="screen">

        <div class="hd-row">
          <div class="crumb" style="margin-bottom:0"><button class="back" id="backHome">${svg('arrowL')}</button><span>${cat?cat.name:''}</span></div>
          ${isAdmin?`
          <div class="hd-actions">
            <button class="hd-btn brand" id="newRecipe">${svg('plus',2)}</button>

            ${!canAccessRecipe(r)?'<span class="rcard-lock">'+svg('lock')+'</span>':''}
            <span class="arrow">${svg('chevR')}</span>
          </div>`).join('')}
    </div>`;
  document.getElementById('backHome').onclick=()=>{ state.gView='home'; render(); window.scrollTo(0,0); };
  if(isAdmin){
  document.getElementById('newRecipe').onclick=()=>{
    const r={ id:uid(), cat:state.catId, name:'未命名配方', updated:Date.now(), image:'', ingredients:[{name:'',gram:''}], steps:'', notes:'', locked:true, lockPwd:DEFAULT_RECIPE_PWD };
    state.recipes.unshift(r); state.recipeId=r.id; state.gView='editor'; persist(true); render(); window.scrollTo(0,0);
  };
  // checkbox toggle
  document.querySelectorAll('.rcard-check').forEach(cb=>{
    cb.onclick=(e)=>{
      e.stopPropagation();
      const rid=cb.dataset.rid;
      if(cb.classList.contains('on')){ cb.classList.remove('on'); recipeSelected.delete(rid); }
      else{ cb.classList.add('on'); recipeSelected.add(rid); }
      updateRecipeDelBtn();
    };
  });
  // delete selected
  document.getElementById('delRecipe').onclick=()=>{
    if(recipeSelected.size===0) return;
    openModal('删除选中的配方？',`确认删除选中的 ${recipeSelected.size} 个配方？此操作无法撤销。`,()=>{
      state.recipes=state.recipes.filter(r=>!recipeSelected.has(r.id));
      persist(true);
      renderRecipeList();
      toast('已删除选中配方','success');
    });
  };
  function updateRecipeDelBtn(){
    const btn=document.getElementById('delRecipe');
    if(btn) btn.disabled = recipeSelected.size===0;
  }
  } // end if(isAdmin)
  // card click -> open editor (with lock check)
  document.querySelectorAll('.rcard').forEach(b=>{
    b.onclick=(e)=>{
      if(e.target.closest('.rcard-check')) return;
      const rid=b.dataset.recipe;
      const recipe=state.recipes.find(r=>r.id===rid);
      if(recipe && !canAccessRecipe(recipe)){
        promptRecipeUnlock(recipe);
      }else{
        state.recipeId=rid; state.gView='editor'; render(); window.scrollTo(0,0);
      }
    };
  });
}

/* ---------- Editor with autosave ---------- */
let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(commitSave,1500); }
function commitSave(){
  const r=state.recipes.find(x=>x.id===state.recipeId);
  if(!r) return;
  // read from DOM
  const ne=document.getElementById('edName'); if(ne){ r.name=ne.value||'未命名配方'; }
  const sc=document.getElementById('edCat'); if(sc){ r.cat=sc.value; }
  const rows=document.querySelectorAll('.ing-row');
  r.ingredients=[];
  rows.forEach(row=>{
    const nm=row.querySelector('.in-name').value.trim();
    const gr=row.querySelector('.in-gram').value.trim();
    if(nm||gr) r.ingredients.push({name:nm,gram:gr});
  });
  const st=document.getElementById('edSteps'); if(st){ r.steps=st.value; }
  const no=document.getElementById('edNotes'); if(no){ r.notes=no.value; }
  r.updated=Date.now();
  persist(false);
}
function saveNow(){ clearTimeout(saveTimer); commitSave(); }

function renderEditor(){
  const r=state.recipes.find(x=>x.id===state.recipeId);
  if(!r){ state.gView='home'; render(); return; }
  const cat = state.categories.find(c=>c.id===r.cat);
  content.innerHTML = `
    <div class="screen">
      <div class="hd">
        <div class="crumb"><button class="back" id="backList">${svg('arrowL')}</button><span>${cat?cat.name:'配方'}</span></div>
      </div>

      <div class="ed-block">
        <div class="ed-label">配方图片</div>
        <div class="ed-img-upload ${r.image?'has-img':''}" id="edImgUpload">
          ${r.image?`<img src="${r.image}" alt="">`:''}
          <svg class="up-icon" viewBox="0 0 24 24"><path d="M12 20V8M7 13l5-5 5 5"/><path d="M5 20h14"/></svg>
          <span class="up-text">${r.image?'':'点击上传图片'}</span>
          ${r.image?`<span class="up-change">更换图片</span>`:''}
        </div>
        <button class="ed-img-search" id="edImgSearch">🔍 按产品名称搜索图片</button>
      </div>

      <div class="ed-block">
        <div class="ed-label">配方名称</div>
        <input class="ed-name" id="edName" value="${esc(r.name)}" placeholder="输入配方名称">
      </div>

      <div class="ed-block">
        <div class="ed-label">分类</div>
        <select class="ed-sel" id="edCat">
          ${state.categories.map(c=>`<option value="${c.id}" ${c.id===r.cat?'selected':''}>${c.name}</option>`).join('')}
        </select>
      </div>

      <div class="ed-block">
        <div class="ed-label">材料清单</div>
        <div id="ingBox">
          ${r.ingredients.map((ing,i)=>ingRowHTML(ing,i)).join('')}

        <div style="display:flex;justify-content:flex-end;margin-top:4px">
          <button class="add-ing-small" id="addIng">${svg('plus',2)}</button>
        </div>
      </div>

      <div class="ed-block">
        <div class="ed-label">制作步骤</div>
        <textarea class="ed-area" id="edSteps" placeholder="描述每个步骤...">${esc(r.steps)}</textarea>
      </div>

      <div class="ed-block">
        <div class="ed-label">注意事项</div>
        <textarea class="ed-area" id="edNotes" style="min-height:90px" placeholder="要点、替换方案、时间...">${esc(r.notes)}</textarea>
      </div>

      <div class="ed-block">
        <div class="ed-label">配方锁定</div>
        <div class="lock-toggle ${r.locked?'on':''}" id="lockToggle">
          <div class="lt-icon">${svg(r.locked?'lock':'unlock')}</div>

        </div>
        <div id="lockPwdWrap" style="${r.locked?'':'display:none'}">
          <input class="lock-input" id="edLockPwd" type="password" value="${esc(r.lockPwd||DEFAULT_RECIPE_PWD)}" placeholder="独立密码（默认1234）">
          <div style="font-size:11px;color:var(--sub);margin-top:4px;padding:0 4px">主密码0823可解锁所有配方。此密码为该配方的独立密码。</div>
        </div>
      </div>

      <button class="del-recipe" id="delRecipe">${svg('trash')} &nbsp;删除此配方</button>
    </div>`;

  document.getElementById('backList').onclick=()=>{ saveNow(); state.gView='list'; render(); window.scrollTo(0,0); };

  // ---- Recipe image upload + AI search ----
  const edImgUpload=document.getElementById('edImgUpload');
  const recipeImgInput=document.getElementById('recipeImgInput');
  if(edImgUpload){
    edImgUpload.onclick=()=>recipeImgInput.click();
  }
  if(recipeImgInput){
    recipeImgInput.onchange=async(e)=>{
      const file=e.target.files[0];
      if(!file) return;
      try{
        const processed=await compressImageFile(file,{maxSize:900,quality:.78,square:true,warm:true});
        r.image=processed;
        persist(true);
        edImgUpload.classList.add('has-img');
        edImgUpload.innerHTML=`<img src="${processed}" alt=""><span class="up-change">更换图片</span>`;
      }catch(err){
        toast(err.message||'图片处理失败，请重试','error');
      }finally{
        e.target.value='';
      }
    };
  }
  const edImgSearchBtn=document.getElementById('edImgSearch');
  if(edImgSearchBtn){
    edImgSearchBtn.onclick=()=>{
      const query=r.name&&r.name!=='未命名配方'?r.name:(cat?cat.name:'');
      openSearchModal(query, async(selectedUrl)=>{
        let finalImage;
        try{
          const base64=await fetchImageAsBase64(selectedUrl);
          if(state.aiImage.apiKey){
            const editedUrl=await editImageWithReference(base64);
            finalImage=await downloadAndProcessAI(editedUrl);
          } else {
            finalImage=await downloadAndProcessAI(selectedUrl);
          }
        }catch(e){
          finalImage=await downloadAndProcessAI(selectedUrl);
        }
        r.image=finalImage;
        persist(true);
        renderEditor();
      });
    };
  }

  // autosave on input (debounced 1.5s)
  ['edName','edCat','edSteps','edNotes'].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('input',scheduleSave);
    el.addEventListener('change',scheduleSave);
  });

  // ingredients interactions
  document.getElementById('addIng').onclick=()=>{
    r.ingredients.push({name:'',gram:''});
    // re-render ingredient rows only
    document.getElementById('ingBox').insertAdjacentHTML('beforeend', ingRowHTML({name:'',gram:''}, r.ingredients.length-1));
    bindIngRows();
    saveNow(); // immediate save on add row
    // focus the new row
    const rows=document.querySelectorAll('.ing-row .in-name');
    rows[rows.length-1].focus();
  };
  bindIngRows();

  // lock toggle
  document.getElementById('lockToggle').onclick=()=>{
    r.locked=!r.locked;
    if(r.locked && !r.lockPwd) r.lockPwd=DEFAULT_RECIPE_PWD;
    persist(true);
    renderEditor();
  };
  const edLockPwd=document.getElementById('edLockPwd');
  if(edLockPwd){
    edLockPwd.addEventListener('input',()=>{
      r.lockPwd=edLockPwd.value.trim()||DEFAULT_RECIPE_PWD;
      scheduleSave();
    });
  }

  document.getElementById('delRecipe').onclick=()=>{
    openModal('删除配方？',`“${esc(r.name)}” 将被永久删除，此操作无法撤销。`,()=>{
      state.recipes=state.recipes.filter(x=>x.id!==r.id);
      persist(true);
      state.gView='list'; state.recipeId=null; render(); window.scrollTo(0,0);
      toast('配方已删除','success');
    });
  };
}

function ingRowHTML(ing,i){
  return `<div class="ing-row">
    <input class="in-name" value="${esc(ing.name)}" placeholder="材料">
    <input class="in-gram" inputmode="numeric" value="${esc(ing.gram)}" placeholder="克">
    <button class="in-del" data-del="${i}">${svg('trash')}</button>
  </div>`;

function bindIngRows(){

/* ---------- Tab 3: Baking Wiki (editable) ---------- */
let wikiSaveTimer=null;
let wikiSelected=new Set(); // indices of selected items in current category
let recipeSelected=new Set(); // ids of selected recipes in current category list
let catSelected=new Set(); // ids of selected categories for deletion

function scheduleWikiSave(){
  clearTimeout(wikiSaveTimer);
  wikiSaveTimer=setTimeout(commitWikiSave,1500);
}
function commitWikiSave(){
  const cat=state.wikiCat;
  const data=state.wiki[cat]; if(!data) return;
  const cards=document.querySelectorAll('.wiki-card-edit');
  data.items=[];
  cards.forEach(card=>{
    const n=card.querySelector('.wk-name').value.trim();
    const d=card.querySelector('.wk-desc').value.trim();
    if(n||d) data.items.push({n,d});
  });
  persist(true);
}
function saveWikiNow(){ clearTimeout(wikiSaveTimer); commitWikiSave(); }

function renderWiki(){
  const cats=Object.keys(state.wiki);
  const active=state.wikiCat||cats[0];
  const data=state.wiki[active];
  if(!data){ content.innerHTML='<div class="screen"><div class="empty">暂无数据</div></div>'; return; }
  wikiSelected.clear();
  const selCount=()=>wikiSelected.size;
  const isAdmin=isLoggedIn()&&isAdminPhone();

  content.innerHTML=`
    <div class="screen">
      <div class="hd">
        <div class="hd-row">
          <div>
            <h1>烘焙百科</h1>
            <p>每种食材都有它的故事</p>
          </div>
          ${isAdmin?`
          <div class="hd-actions">
            <button class="hd-btn brand" id="wikiAdd">${svg('plus',2)}</button>
            <button class="hd-btn danger" id="wikiDel">${svg('trash')}</button>
          </div>
          `:''}
        </div>
      </div>
      <div class="wiki-tabs">
        ${cats.map(c=>`<button class="wtab ${c===active?'on':''}" data-wcat="${c}">${c}</button>`).join('')}
      </div>
      <div class="wiki-grid" id="wikiGrid">
        ${data.items.map((it,i)=>wikiCardHTML(it,i,data.icon,isAdmin)).join('')}
      </div>
    </div>`;

  // tab switching — preserve scroll position
  document.querySelectorAll('.wtab').forEach(b=>{
    b.onclick=()=>{
      saveWikiNow();
      const tabsEl=document.querySelector('.wiki-tabs');
      const savedScroll=tabsEl?tabsEl.scrollLeft:0;
      state.wikiCat=b.dataset.wcat;
      renderWiki();
      // Restore tab scroll position after re-render
      const newTabs=document.querySelector('.wiki-tabs');
      if(newTabs) newTabs.scrollLeft=savedScroll;
    };
  });

  // add — chooser: category or item (admin only)
  if(isAdmin){
  document.getElementById('wikiAdd').onclick=()=>{
    openActionSheet('添加','请选择添加类型',[
      {label:'添加分类',variant:'brand',action:()=>{
        const name=prompt('输入新分类名称：');
        if(!name||!name.trim()) return;
        name=name.trim();
        if(state.wiki[name]){ toast('该分类已存在','error'); return; }
        state.wiki[name]={icon:'spice',items:[]};
        state.wikiCat=name;
        persist(true);
        renderWiki();
        toast('已添加分类：'+name,'success');
      }},
      {label:'添加食材',action:()=>{
        clearTimeout(wikiSaveTimer);
        const cat=state.wikiCat||Object.keys(state.wiki)[0];
        const cur=state.wiki[cat];
        if(!cur){ toast('数据异常，无法添加','error'); return; }
        if(!cur.items) cur.items=[];
        cur.items.unshift({n:'',d:''});
        renderWiki();
        window.scrollTo({top:0, behavior:'smooth'});
        setTimeout(()=>{
          const firstCard=document.querySelector('#wikiGrid .wiki-card-edit');
          if(firstCard){
            firstCard.querySelector('.wk-name').focus();
            firstCard.style.transition='box-shadow .4s ease';
            firstCard.style.boxShadow='0 0 0 2px var(--brand), 0 4px 14px rgba(139,111,78,.25)';
            setTimeout(()=>{ firstCard.style.boxShadow=''; }, 1500);
          }
          persist(true);
          toast('已添加新行','success');
        }, 100);
      }},
      {label:'取消'},
    ]);
  };

  // delete — chooser: category or selected items
  document.getElementById('wikiDel').onclick=()=>{
    const hasSel=wikiSelected.size>0;
    const opts=[
      {label:'删除当前分类',variant:'danger',action:()=>{
        const cats=Object.keys(state.wiki);
        if(cats.length<=1){ toast('至少保留一个分类','error'); return; }
        const cur=state.wikiCat||cats[0];
        openModal('删除分类？',`确认删除分类「${cur}」及其所有食材？此操作无法撤销。`,()=>{
          delete state.wiki[cur];
          state.wikiCat=Object.keys(state.wiki)[0];
          persist(true);
          renderWiki();
          toast('已删除分类：'+cur,'success');
        });
      }},
    ];
    if(hasSel){
      opts.push({label:`删除选中食材(${wikiSelected.size})`,variant:'danger',action:()=>{
        openModal('删除选中的食材？',`确认删除选中的 ${wikiSelected.size} 项食材？此操作无法撤销。`,()=>{
          const indices=Array.from(wikiSelected).sort((a,b)=>b-a);
          indices.forEach(idx=>{ data.items.splice(idx,1); });
          saveWikiNow();
          renderWiki();
          toast('已删除选中食材','success');
        });
      }});
    }
    opts.push({label:'取消'});
    openActionSheet('删除','请选择删除类型',opts);
  };
  } // end if(isAdmin)

  // auto-save on input (admin only — non-admin inputs are readonly)
  if(isAdmin){
    document.querySelectorAll('.wk-name, .wk-desc').forEach(el=>{
      el.addEventListener('input',scheduleWikiSave);
    });

    // checkbox toggle (admin only)
    document.querySelectorAll('.wk-check').forEach(cb=>{
      cb.onclick=()=>{
        const idx=parseInt(cb.dataset.idx,10);
        if(cb.classList.contains('on')){ cb.classList.remove('on'); wikiSelected.delete(idx); }
        else{ cb.classList.add('on'); wikiSelected.add(idx); }
        updateWikiDelBtn();
      };
    });
  }

  function updateWikiDelBtn(){
    const btn=document.getElementById('wikiDel');
    if(btn) btn.disabled = false; // always enabled: category delete is always available
  }
}

function wikiCardHTML(it,i,iconName,canEdit){
  const ro=canEdit?'':'readonly';

/* ---------- Memo (local only, NOT synced) ---------- */
const MEMO_KEY='recipe-atelier-memos';
function loadMemos(){
  try{ return JSON.parse(localStorage.getItem(MEMO_KEY))||[]; }catch(e){ return []; }
}
function saveMemos(memos){
  localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
}
function initMemo(){
  const listEl=document.getElementById('memoList');
  const addBtn=document.getElementById('memoAdd');
  if(!listEl||!addBtn) return;
  let memos=loadMemos();

  function renderList(){
    if(!memos.length){
      listEl.innerHTML='<div class="memo-empty">点击 + 添加备忘<br><br>记录你的烘焙灵感<br>配方调整笔记、购物清单...</div>';
      return;
    }
    listEl.innerHTML=memos.map((m,i)=>`
      <div class="memo-item" data-idx="${i}">
        <textarea rows="1" placeholder="输入备忘内容..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(m)}</textarea>
        <button class="memo-del" data-del="${i}">✕</button>
      </div>`).join('');
    // Auto-resize textareas
    listEl.querySelectorAll('textarea').forEach(ta=>{
      ta.style.height='auto';
      ta.style.height=ta.scrollHeight+'px';
    });
    // Bind events
    listEl.querySelectorAll('textarea').forEach((ta,i)=>{
      ta.onblur=()=>{ memos[i]=ta.value; saveMemos(memos); };
    });
    listEl.querySelectorAll('.memo-del').forEach(btn=>{
      btn.onclick=()=>{
        const idx=parseInt(btn.dataset.del);
        memos.splice(idx,1);
        saveMemos(memos);
        renderList();
      };
    });
  }

  addBtn.onclick=()=>{
    memos.push('');
    saveMemos(memos);
    renderList();
    // Focus the newly added textarea
    setTimeout(()=>{
      const last=listEl.querySelector('.memo-item:last-child textarea');
      if(last) last.focus();
    },50);
  };

  renderList();
}

let _focusHandlerBound=false;

  if(_focusHandlerBound) return;
  _focusHandlerBound=true;
  document.addEventListener('focusin',(e)=>{

    if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT')){

    localStorage.setItem(DEVICE_ID_KEY,id);

function getDeviceInfo(){
  const ua=navigator.userAgent;
  let platform='Unknown',name='未知设备';
  if(/iPhone/.test(ua)){platform='iOS';name='iPhone';}
  else if(/iPad/.test(ua)){platform='iOS';name='iPad';}
  else if(/Android/.test(ua)){platform='Android';name='Android设备';}
  else if(/Windows/.test(ua)){platform='Windows';name='Windows电脑';}
  else if(/Macintosh/.test(ua)){platform='macOS';name='Mac电脑';}
  return{name,platform,userAgent:ua};

async function checkDeviceLock(){
  const auth=getAuthState();
  if(!auth.phone||!auth.token) return false;
  try{
    const url=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json?access_token='+encodeURIComponent(auth.token);
    const res=await fetch(url);
    if(!res.ok) return false;
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content)));
    const users=JSON.parse(content);
    const user=users.find(u=>u.phone===auth.phone);
    if(!user) return false;
    const dev=(user.devices||[]).find(d=>d.deviceId===getDeviceId());
    return !!(dev&&dev.locked);
  }catch(e){return false;}
}

async function getDevicesList(){
  const auth=getAuthState();
  if(!auth.phone||!auth.token) return[];
  try{
    const url=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json?access_token='+encodeURIComponent(auth.token);
    const res=await fetch(url);
    if(!res.ok) return[];
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content)));
    const users=JSON.parse(content);
    // Admin: return ALL devices from ALL users
    const allDevices=[];
    users.forEach(u=>{
      (u.devices||[]).forEach(d=>{
        allDevices.push({...d, phone:u.phone});
      });
    });
    // Deduplicate: per phone + deviceName + platform, keep most recent login
    const dedupMap={};
    allDevices.forEach(d=>{
      const key=(d.phone||'')+'|'+(d.deviceName||'未知设备')+'|'+(d.platform||'Unknown');
      if(!dedupMap[key]||new Date(d.lastLogin)>new Date(dedupMap[key].lastLogin)){
        dedupMap[key]=d;
      }
    });
    return Object.values(dedupMap).sort((a,b)=>{
      const aAdmin=ADMIN_PHONES.includes(a.phone), bAdmin=ADMIN_PHONES.includes(b.phone);
      if(aAdmin!==bAdmin) return aAdmin ? -1 : 1;
      const at=a.lastLogin?new Date(a.lastLogin).getTime():0;
      const bt=b.lastLogin?new Date(b.lastLogin).getTime():0;
      return bt-at;
    });
  }catch(e){return[];}
}

async function lockUnlockDevice(deviceId,locked){
  const auth=getAuthState();
  if(!auth.phone||!auth.token) return false;
  try{
    const url=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json?access_token='+encodeURIComponent(auth.token);
    const res=await fetch(url);
    if(!res.ok) return false;
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content)));
    const users=JSON.parse(content);
    // Search across ALL users to find the device
    let found=false;
    users.forEach(u=>{
      const dev=(u.devices||[]).find(d=>d.deviceId===deviceId);
      if(dev){ dev.locked=locked; found=true; }
    });
    if(!found) return false;
    const newContent=btoa(unescape(encodeURIComponent(JSON.stringify(users,null,2))));
    const updateUrl=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json';
    const updateRes=await fetch(updateUrl,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({access_token:auth.token,content:newContent,sha:data.sha,message:'Update device lock'})
    });
    return updateRes.ok;
  }catch(e){return false;}
}

async function updateDeviceName(deviceId,newName){

    const users=JSON.parse(content);
    let found=false;
    users.forEach(u=>{

        if(d.deviceId===deviceId){
          d.deviceName=newName;

    const updateRes=await fetch(updateUrl,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({access_token:auth.token,content:newContent,sha:data.sha,message:'Update device name'})
    });
    return updateRes.ok;
  }catch(e){return false;}
}

async function deleteDevice(deviceId){
  const auth=getAuthState();
  if(!auth.phone||!auth.token) return false;
  try{
    const url=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json?access_token='+encodeURIComponent(auth.token);
    const res=await fetch(url);
    if(!res.ok) return false;
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content)));
    const users=JSON.parse(content);
    let found=false;
    users.forEach(u=>{
      const before=(u.devices||[]).length;
      u.devices=(u.devices||[]).filter(d=>d.deviceId!==deviceId);
      if(u.devices.length<before) found=true;
    });
    if(!found) return false;
    const newContent=btoa(unescape(encodeURIComponent(JSON.stringify(users,null,2))));
    const updateUrl=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json';
    const updateRes=await fetch(updateUrl,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({access_token:auth.token,content:newContent,sha:data.sha,message:'Delete device record'})
    });
    return updateRes.ok;
  }catch(e){return false;}
}

function bindDeviceSwipeDelete(listEl){
  const DELETE_WIDTH=76;
  let activeSwipe=null;
  // Close all swipes
  function closeAllSwipes(except){
    listEl.querySelectorAll('.device-swipe-content.swiped').forEach(el=>{
      if(el!==except){ el.classList.remove('swiped'); }
    });
  }
  // Touch handlers
  listEl.querySelectorAll('.device-swipe-content').forEach(content=>{
    let startX=0,startY=0,currentX=0,dragging=false,lockedDir=false,isHorizontal=false;
    content.addEventListener('touchstart',e=>{
      if(content.classList.contains('current')) return;
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      currentX=content.classList.contains('swiped')?-DELETE_WIDTH:0;
      dragging=true; lockedDir=false; isHorizontal=false;
      content.classList.add('dragging');
      // Close other swipes
      closeAllSwipes(content);
      activeSwipe=content;
    },{passive:true});
    content.addEventListener('touchmove',e=>{
      if(!dragging||content.classList.contains('current')) return;
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(!lockedDir){
        if(Math.abs(dx)>8||Math.abs(dy)>8){
          isHorizontal=Math.abs(dx)>Math.abs(dy);
          lockedDir=true;
        }
      }
      if(isHorizontal){
        let newX=currentX+dx;
        if(newX>0) newX=0;
        if(newX<-DELETE_WIDTH) newX=-DELETE_WIDTH;
        content.style.transform='translateX('+newX+'px)';
      }
    },{passive:true});
    content.addEventListener('touchend',e=>{
      if(!dragging||content.classList.contains('current')) return;
      dragging=false;
      content.classList.remove('dragging');
      const dx=e.changedTouches[0].clientX-startX;
      if(!isHorizontal){
        content.style.transform='';
        return;
      }
      const threshold=DELETE_WIDTH/2;
      const shouldOpen=(currentX+dx)<-threshold||dx<-threshold;
      if(shouldOpen){
        content.classList.add('swiped');
        content.style.transform='';
        activeSwipe=content;
      }else{
        content.classList.remove('swiped');
        content.style.transform='';
      }
    },{passive:true});
  });
  // Click delete button
  listEl.querySelectorAll('.device-swipe-delete').forEach(btn=>{
    btn.onclick=()=>{
      const deviceId=btn.dataset.id;
      const deviceName=btn.dataset.name;
      openModal('删除设备记录？','将永久删除「'+deviceName+'」的登录记录，该设备下次需要重新登录。',async()=>{
        btn.disabled=true;
        const ok=await deleteDevice(deviceId);
        if(ok){
          toast('设备记录已删除','success');
          renderProfile();
        }else{
          toast('删除失败，请重试','error');
          btn.disabled=false;
        }
      });
    };
  });
  // Click outside to close swipes
  document.addEventListener('click',e=>{
    if(activeSwipe&&!e.target.closest('.device-swipe-wrap')){
      activeSwipe.classList.remove('swiped');
      activeSwipe=null;
    }
  },{passive:true});
}

let _pnvsSDK=null;
function loadNumberAuthSDK(){
  if(_pnvsSDK) return Promise.resolve(_pnvsSDK);
  if(window.PhoneNumberServer){
    _pnvsSDK=new window.PhoneNumberServer();
    return Promise.resolve(_pnvsSDK);
  }
  const urls=[
    './vendor/aliyun-numberauth/2.1.15/numberAuth-web-sdk.js',
    'https://recipe-auth-qfcvanmdxp.cn-beijing.fcapp.run/vendor/aliyun-numberauth/2.1.15/numberAuth-web-sdk.js'
  ];
  let idx=0;
  function tryLoad(){
    if(idx>=urls.length) return Promise.reject(new Error('SDK加载失败'));
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=urls[idx++];
      s.onload=()=>{
        if(window.PhoneNumberServer){
          _pnvsSDK=new window.PhoneNumberServer();
          resolve(_pnvsSDK);
        }else{
          s.remove();
          tryLoad().then(resolve).catch(reject);
        }
      };
      s.onerror=()=>{ s.remove(); tryLoad().then(resolve).catch(reject); };
      document.head.appendChild(s);
    });
  }
  return tryLoad();
}

async function tryOneClickLogin(msgEl,overlay){
  if(!FC_API_URL){ msgEl.textContent='后端服务未配置，请使用密码或验证码登录'; return; }
  msgEl.textContent='正在初始化一键登录…';
  try{
    const sdk=await loadNumberAuthSDK();
    const netType=sdk.getConnection?sdk.getConnection():'unknown';
    if(netType==='wifi'){
      msgEl.textContent='一键登录需使用移动数据，请关闭WiFi后重试，或使用验证码登录';
      return;
    }
    const tokenRes=await callBackend('getAuthToken',{
      url:window.location.href.split('#')[0],
      origin:window.location.origin
    });
    if(!tokenRes.success){
      msgEl.textContent=tokenRes.error||'获取认证Token失败';
      return;
    }
    sdk.checkLoginAvailable({
      accessToken:tokenRes.accessToken,
      jwtToken:tokenRes.jwtToken,
      success:function(res){
        if(res.code!==600000){
          msgEl.textContent='一键登录不可用，请使用验证码登录';
          return;
        }
        sdk.getLoginToken({
          authPageOption:{
            navText:'本机号码登录',
            btnText:'一键登录',
            isDialog:true,
            manualClose:true,
            privacyBefore:'我已阅读并同意',
            privacyOne:['《用户协议》',''],
            privacyTwo:['《隐私政策》',''],
            showCustomView:true,
            customView:{
              element:'<div class="pnvs_other" id="pnvsOtherLogin">切换其他登录方式</div>',
              style:'.pnvs_other{background:#fff;color:#C48C5C;text-align:center;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;margin-top:8px}',
              js:'document.getElementById("pnvsOtherLogin").onclick=function(){if(window._pnvsSDK)window._pnvsSDK.closeLoginPage();}'
            }
          },
          success:async function(res){
            if(res.code!==600000){
              msgEl.textContent=res.msg||'获取登录Token失败';
              return;
            }
            try{
              const phoneRes=await callBackend('getPhone',{
                spToken:res.spToken,
                deviceId:getDeviceId(),
                deviceInfo:getDeviceInfo()
              });
              if(phoneRes.success){
                sdk.closeLoginPage();
                setAuthState({phone:phoneRes.phone,token:phoneRes.token,giteeOwner:phoneRes.giteeOwner,giteeRepo:phoneRes.giteeRepo});
                state.sync.giteeToken=DEFAULT_GITEE_TOKEN;
                state.sync.giteeRepo=phoneRes.giteeOwner+'/'+phoneRes.giteeRepo;
                state.sync.giteeOwner=phoneRes.giteeOwner;
                writeLocal();
                overlay.remove();
                syncPull(true).then(()=>{render();}).catch(()=>{});
                render();
              }else{
                msgEl.textContent=phoneRes.error||'一键登录失败';
                if(phoneRes.deviceLocked) showDeviceLockedScreen();
              }
            }catch(e){ msgEl.textContent='网络错误'; }
          },
          error:function(res){ msgEl.textContent='授权取消或失败，请使用验证码登录'; },
          watch:function(status,data){ if(status===2) msgEl.textContent=''; }
        });
      },
      error:function(res){
        msgEl.textContent='一键登录不可用（可能处于WiFi网络），请使用验证码登录';
      }
    });
  }catch(e){
    msgEl.textContent='SDK加载失败，请使用验证码登录';
  }
}

  // Logged in — check if current device is locked
  checkDeviceLock().then(locked=>{
    if(locked){
      showDeviceLockedScreen();
    }
  });
  // Load device-specific recipe permissions (non-admin only)
  if(!isAdminPhone()){
    fetchDeviceRecipePermissions().then(perms=>{
      deviceRecipePermissions=perms;
      // Re-render gallery if currently showing
      if(state.activeTab==='gallery') render();
    });
  }
}
render();
if(bootRepaired){
  toast('已自动修复乱码数据','success');
}
if(urlSyncApplied){
  toast('✓ 已从链接自动配置同步','success');
}
// background pull on startup so a new device fetches cloud data
if(syncConfigured()){
  syncPull(true).then(()=>{
    if(state.sync.localUpdatedAt > state.sync.lastSyncedAt) syncPush(true);
  });
}
// pull when the tab regains focus or becomes visible again (cross-device freshness)
let lastPullTs=0;
async function maybePullOnFocus(){
  if(!syncConfigured()) return;
  const now=Date.now();
  if(now - lastPullTs < 10000) return; // throttle: at most once per 10s
  lastPullTs=now;
  await syncPull(true);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) maybePullOnFocus(); });
window.addEventListener('focus', maybePullOnFocus);
// periodic cloud poll every 30s for cross-device sync (catches updates even without focus events)
if(syncConfigured()){
  setInterval(()=>{ if(!document.hidden) maybePullOnFocus(); }, 30000);
}

/* ---------- Avatar Upload (file picker) ---------- */
function uploadAvatar(){
  const input=document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange=(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    if(file.size>20*1024*1024){ toast('图片不能超过20MB','error'); return; }
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        canvas.width=120; canvas.height=120;
        const ctx=canvas.getContext('2d');
        const minDim=Math.min(img.width,img.height);
        const sx=(img.width-minDim)/2, sy=(img.height-minDim)/2;
        ctx.drawImage(img,sx,sy,minDim,minDim,0,0,120,120);
        state.profile.avatar=canvas.toDataURL('image/jpeg',0.85);
        persist(true);
        renderProfile();
        toast('头像已更新','success');
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

    const users=JSON.parse(content);
    let currentPerms=[];
    users.forEach(u=>{
      const dev=(u.devices||[]).find(d=>d.deviceId===deviceId);
      if(dev) currentPerms=dev.recipePermissions||[];
    });
    selectedIds=new Set(currentPerms);

    const listEl=document.getElementById('permList');
    if(allRecipes.length===0){
      listEl.innerHTML='<div style="text-align:center;color:rgba(210,105,30,.5);padding:20px;font-size:16px">暂无配方</div>';
      return;
    }
    listEl.innerHTML=allRecipes.map(r=>`
      <div class="perm-item" data-rid="${r.id}" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.1);margin-bottom:6px;cursor:pointer;transition:background .2s">
        <div class="perm-check" style="width:26px;height:26px;border-radius:50%;border:2px solid rgba(210,105,30,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:0;transform:scale(.5);transition:all .18s"><path d="M5 12l5 5 9-12"/></svg>
        </div>
        <span style="color:rgba(210,105,30,.5);font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
      </div>
    `).join('');

    function updateCheck(el){
      const rid=el.dataset.rid;
      const chk=el.querySelector('.perm-check');
      if(selectedIds.has(rid)){
        chk.style.background='var(--brand)';
        chk.style.borderColor='var(--brand)';
        chk.querySelector('svg').style.opacity='1';
        chk.querySelector('svg').style.transform='scale(1)';
        el.style.background='rgba(255,182,193,.2)';
      }else{
        chk.style.background='';
        chk.style.borderColor='rgba(210,105,30,.3)';
        chk.querySelector('svg').style.opacity='0';
        chk.querySelector('svg').style.transform='scale(.5)';
        el.style.background='rgba(255,255,255,.1)';
      }
    }

    listEl.querySelectorAll('.perm-item').forEach(el=>{
      updateCheck(el);
      el.onclick=()=>{
        const rid=el.dataset.rid;
        if(selectedIds.has(rid)) selectedIds.delete(rid);
        else selectedIds.add(rid);
        updateCheck(el);
      };
    });

    document.getElementById('permSelectAll').onclick=()=>{
      allRecipes.forEach(r=>selectedIds.add(r.id));
      listEl.querySelectorAll('.perm-item').forEach(el=>updateCheck(el));
    };
    document.getElementById('permSelectNone').onclick=()=>{
      selectedIds.clear();
      listEl.querySelectorAll('.perm-item').forEach(el=>updateCheck(el));
    };
  }).catch(()=>{
    document.getElementById('permList').innerHTML='<div style="text-align:center;color:rgba(210,105,30,.5);padding:20px;font-size:16px">加载失败</div>';
  });

  document.getElementById('permCancel').onclick=()=>{ closePanel(); };
  document.getElementById('permConfirm').onclick=async()=>{
    const btn=document.getElementById('permConfirm');
    btn.textContent='保存中...'; btn.disabled=true;
    const ok=await setDeviceRecipePermissions(deviceId,Array.from(selectedIds));
    if(ok){
      toast('配方权限已更新','success');
      closePanel();
    }else{
      toast('保存失败，请重试','error');
      btn.textContent='确认'; btn.disabled=false;
    }
  };
}

// ---------- URL param: force_sw_clear=1 (auto clear SW + cache on every visit) ----------
const _forceSwClear = new URLSearchParams(window.location.search).get('force_sw_clear')==='1';
if(_forceSwClear){
  (async()=>{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const k of keys) await caches.delete(k);
    }
    sessionStorage.removeItem('sw_reloaded');
    // Wait to ensure unregistration is fully processed by browser
    await new Promise(r=>setTimeout(r, 500));
    // Reload without the param, add cache-busting to force fresh fetch
    const url=new URL(window.location.href);
    url.searchParams.delete('force_sw_clear');
    url.searchParams.set('_t', Date.now());
    window.location.replace(url.toString());
  })();
}

// ---------- PWA Service Worker Registration ----------
// Skip registration when force_sw_clear is active to prevent re-registering old SW
const ENABLE_SERVICE_WORKER=false; // 临时关闭，避免旧缓存导致页面卡住
if(ENABLE_SERVICE_WORKER && !_forceSwClear && 'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(reg=>{
    // Check for SW updates every 60 seconds
    setInterval(()=>{ reg.update().catch(()=>{}); }, 60000);
  }).catch(()=>{});
  // When a new SW takes control, force reload to load new assets
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    // Prevent reload loop with a flag
    if(!sessionStorage.getItem('sw_reloaded')){
      sessionStorage.setItem('sw_reloaded','1');
      window.location.reload();
    }
  });
}

// ---------- Remote Version Check ----------
// 只从阿里云 OSS 获取版本信息，避免海外 CDN 造成卡顿
const APP_VERSION='v9';
async function checkRemoteVersion(){
  try{
    const res=await fetch('./sw.js?_t='+Date.now(),{cache:'no-store'});
    if(!res || !res.ok) return;
    const text=await res.text();
    const m=text.match(/recipe-atelier-(v\d+)/);
    if(m && m[1] !== APP_VERSION){
      // Version mismatch — force clear everything and reload
      console.log('Version mismatch: local='+APP_VERSION+' remote='+m[1]+' — forcing update');
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        for(const r of regs) await r.unregister();
      }
      if('caches' in window){
        const keys=await caches.keys();
        for(const k of keys) await caches.delete(k);
      }
      sessionStorage.removeItem('sw_reloaded');
      window.location.reload(true);
    }
  }catch(e){ /* network error — skip */ }
}
// Check 3 seconds after page load
setTimeout(checkRemoteVersion, 3000);
// Check every 5 minutes
setInterval(checkRemoteVersion, 300000);
