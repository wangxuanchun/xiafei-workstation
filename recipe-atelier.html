  function updateCatDelBtn(){
    const btn=document.getElementById('catDel');
    if(btn) btn.disabled=catSelected.size===0;
  }
  // init long-press drag-to-reorder
  initCategoryDrag();
}

/* ---------- Long-press drag-to-reorder for category cards (FLIP animation) ---------- */
let catDragJustEnded=false;
function initCategoryDrag(){
  const cards=document.querySelectorAll('.cat');
  if(cards.length<2) return;
  let dragCard=null, dragGhost=null, longPressTimer=null, isHolding=false, isDragging=false;
  let lastX=0, lastY=0, tiltAngle=0;
  const HOLD_MS=500;

  function getCardAtPoint(x, y){
    if(dragGhost) dragGhost.style.display='none';
    const el=document.elementFromPoint(x, y);
    if(dragGhost) dragGhost.style.display='';
    if(el){
      const card=el.closest('.cat');
      if(card) return card;
    }
    // fallback: coordinate matching
    const grid=document.querySelector('.grid');
    if(!grid) return null;
    const allCards=[...grid.querySelectorAll('.cat')];
    for(const card of allCards){
      if(card===dragCard) continue;
      const rect=card.getBoundingClientRect();
      if(x>=rect.left && x<=rect.right && y>=rect.top && y<=rect.bottom) return card;
    }
    return null;
  }

  // FLIP: record positions → swap → invert → play
  function swapWithFLIP(targetCard){
    if(!targetCard || targetCard===dragCard) return false;
    const grid=document.querySelector('.grid');
    const all=[...grid.querySelectorAll('.cat')];
    const fromIdx=all.indexOf(dragCard);
    const toIdx=all.indexOf(targetCard);
    if(fromIdx<0 || toIdx<0 || fromIdx===toIdx) return false;

    // FIRST: record positions of all cards
    const positions=new Map();
    all.forEach(c=>positions.set(c, c.getBoundingClientRect()));

    // LAST: do the DOM swap
    if(fromIdx<toIdx) targetCard.after(dragCard);
    else grid.insertBefore(dragCard, targetCard);

    // INVERT + PLAY: animate from old position to new
    all.forEach(c=>{
      const oldRect=positions.get(c);
      const newRect=c.getBoundingClientRect();
      const dx=oldRect.left-newRect.left;
      const dy=oldRect.top-newRect.top;
      if(dx===0 && dy===0) return;
      c.classList.add('flip-anim');
      c.style.transform=`translate(${dx}px, ${dy}px)`;
      c.style.transition='none';
      // force reflow
      c.offsetHeight;
      c.style.transition='';
      c.style.transform='';
    });
    // cleanup flip-anim class after animation
    setTimeout(()=>{ all.forEach(c=>c.classList.remove('flip-anim')); }, 360);
    return true;
  }

  function beginDrag(card){
    isDragging=true;
    const rect=card.getBoundingClientRect();
    dragCard=card;
    dragCard.classList.add('drag-ghost');
    // create ghost
    dragGhost=card.cloneNode(true);
    dragGhost.classList.add('dragging');
    dragGhost.classList.remove('drag-ghost');
    dragGhost.style.width=rect.width+'px';
    dragGhost.style.height=rect.height+'px';
    dragGhost.style.left=rect.left+'px';
    dragGhost.style.top=rect.top+'px';
    dragGhost.style.transform='scale(1.05) rotate(0deg)';
    document.body.appendChild(dragGhost);
    // show hint
    const hint=document.getElementById('dragHint');
    if(hint) hint.classList.add('show');
    if(navigator.vibrate) navigator.vibrate(20);
  }

  function moveDrag(x, y){
    if(!dragGhost) return;
    lastX=x; lastY=y;
    const w=dragGhost.offsetWidth, h=dragGhost.offsetHeight;
    dragGhost.style.left=(x - w/2)+'px';
    dragGhost.style.top=(y - h/2)+'px';
    // subtle tilt based on horizontal velocity
    tiltAngle=Math.max(-4, Math.min(4, (x - lastX) * 0.3));
    dragGhost.style.transform=`scale(1.05) rotate(${tiltAngle}deg)`;
    // highlight target
    document.querySelectorAll('.cat.drag-over').forEach(c=>c.classList.remove('drag-over'));
    const target=getCardAtPoint(x, y);
    if(target && target!==dragCard) target.classList.add('drag-over');
  }

  function endDrag(){
    if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
    if(!isDragging){ isHolding=false; return; }
    isDragging=false; isHolding=false;
    catDragJustEnded=true;
    setTimeout(()=>{ catDragJustEnded=false; }, 400);

    const hint=document.getElementById('dragHint');
    if(hint) hint.classList.remove('show');
    document.querySelectorAll('.cat.drag-over').forEach(c=>c.classList.remove('drag-over'));

    if(dragGhost && dragCard){
      // determine drop target
      const rect=dragGhost.getBoundingClientRect();
      const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
      const target=getCardAtPoint(cx, cy);
      const didSwap = target && target!==dragCard;

      if(didSwap){
        // animate ghost to target card's position, then swap with FLIP
        const targetRect=target.getBoundingClientRect();
        dragGhost.style.transition='left .3s cubic-bezier(.2,.9,.3,1), top .3s cubic-bezier(.2,.9,.3,1), transform .3s ease, opacity .3s ease';
        dragGhost.style.left=targetRect.left+'px';
        dragGhost.style.top=targetRect.top+'px';
        dragGhost.style.transform='scale(1) rotate(0deg)';
        dragGhost.style.opacity='0';

        // after ghost animation, do FLIP swap and cleanup
        setTimeout(()=>{
          swapWithFLIP(target);
          if(dragCard) dragCard.classList.remove('drag-ghost');
          if(dragGhost){ dragGhost.remove(); dragGhost=null; }
          saveNewOrder();
          dragCard=null;
        }, 300);
      } else {
        // no swap — animate ghost back to original position
        const origRect=dragCard.getBoundingClientRect();
        dragGhost.style.transition='left .3s cubic-bezier(.2,.9,.3,1), top .3s cubic-bezier(.2,.9,.3,1), transform .3s ease';
        dragGhost.style.left=origRect.left+'px';
        dragGhost.style.top=origRect.top+'px';
        dragGhost.style.transform='scale(1) rotate(0deg)';
        setTimeout(()=>{
          if(dragCard) dragCard.classList.remove('drag-ghost');
          if(dragGhost){ dragGhost.remove(); dragGhost=null; }
          dragCard=null;
        }, 300);
      }
    } else {
      if(dragCard) dragCard.classList.remove('drag-ghost');
      dragCard=null; dragGhost=null;
    }

    document.removeEventListener('mousemove', docMouseMove);
    document.removeEventListener('mouseup', docMouseUp);
    document.removeEventListener('touchmove', docTouchMove);
    document.removeEventListener('touchend', docTouchEnd);
    document.removeEventListener('touchcancel', docTouchEnd);
  }

  function saveNewOrder(){
    const grid=document.querySelector('.grid');
    if(grid){
      const newOrder=[...grid.querySelectorAll('.cat')].map(el=>el.dataset.cat);
      state.categories.sort((a,b)=>newOrder.indexOf(a.id)-newOrder.indexOf(b.id));
      persist(true);
    }
  }

  function docMouseMove(e){
    if(!isHolding) return;
    if(!isDragging) beginDrag(dragCard);
    e.preventDefault();
    moveDrag(e.clientX, e.clientY);
  }
  function docMouseUp(){ endDrag(); }
  function docTouchMove(e){
    if(!isHolding) return;
    if(!isDragging) beginDrag(dragCard);
    e.preventDefault();
    const t=e.touches[0];
    moveDrag(t.clientX, t.clientY);
  }
  function docTouchEnd(){ endDrag(); }

  cards.forEach(card=>{
    card.addEventListener('mousedown', (e)=>{
      if(e.target.closest('.cat-check')||e.target.closest('.cat-edit')) return;
      if(e.button!==0) return;
      isHolding=true; isDragging=false; dragCard=card;
      longPressTimer=setTimeout(()=>{
        if(!isHolding) return;
        document.addEventListener('mousemove', docMouseMove);
        document.addEventListener('mouseup', docMouseUp);
      }, HOLD_MS);
    });
    card.addEventListener('touchstart', (e)=>{
      if(e.target.closest('.cat-check')||e.target.closest('.cat-edit')) return;
      isHolding=true; isDragging=false; dragCard=card;
      longPressTimer=setTimeout(()=>{
        if(!isHolding) return;
        if(navigator.vibrate) navigator.vibrate(30);
        document.addEventListener('touchmove', docTouchMove, {passive:false});
        document.addEventListener('touchend', docTouchEnd);
        document.addEventListener('touchcancel', docTouchEnd);
      }, HOLD_MS);
    }, {passive:true});
    card.addEventListener('touchmove', ()=>{
      if(longPressTimer && !isHolding){ clearTimeout(longPressTimer); longPressTimer=null; }
    }, {passive:true});
    card.addEventListener('touchend', ()=>{
      if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
      isHolding=false;
    });
  });
}

/* ---------- AI Image: Search (Openverse) → Pick → Style Edit (wanx2.1-imageedit) ---------- */

// Step 1: Search food images via Openverse API (free, no key, CORS-friendly)
async function searchFoodImages(query){
  const url='https://api.openverse.org/v1/images/?q='+encodeURIComponent(query+' food dessert')+'&page_size=9&mature=false';
  const resp=await fetch(url);
  if(!resp.ok) throw new Error('搜索服务暂不可用');
  const data=await resp.json();
  const results=(data.results||[]).map(r=>({
    id:r.id,
    url:r.url,
    thumb:r.thumbnail||r.url,
    title:r.title||'',
    license:r.license||''
  }));
  if(!results.length) throw new Error('未找到相关图片');
  return results;
}

// Step 2: Download image and convert to base64 (with CORS proxy fallback)
async function fetchImageAsBase64(imageUrl){
  // Try direct fetch first
  try{
    const resp=await fetch(imageUrl,{mode:'cors'});
    if(resp.ok){
      const blob=await resp.blob();
      return await new Promise((resolve)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.readAsDataURL(blob); });
    }
  }catch(e){ /* fall through to proxy */ }
  // Fallback: CORS proxy
  const proxyUrl='https://corsproxy.io/?url='+encodeURIComponent(imageUrl);
  const resp=await fetch(proxyUrl);
  const blob=await resp.blob();
  return await new Promise((resolve)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.readAsDataURL(blob); });
}

// Step 3: Edit image with wanx2.1-imageedit (async task) — keep subject, change style only
async function editImageWithReference(base64Image){
  const stylePrompt='Apply warm beige color tones, soft natural diffused lighting, vintage polaroid film grain texture, slight vignette, cozy and appetizing atmosphere. Keep the food subject completely unchanged — do not alter shape, position, or identity. Only modify lighting, color tone, and overall mood.';
  const body={
    model:'wanx2.1-imageedit',
    input:{
      prompt:stylePrompt,
      function:'description_edit',
      base_image_url:base64Image
    },
    parameters:{ strength:0.35, n:1, watermark:false }
  };
  // Create async task
  const resp=await fetch('https://dashscope.aliyuncs.com/api/v1/services/aigc/image2image/image-synthesis',{
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+state.aiImage.apiKey, 'X-DashScope-Async':'enable' },
    body:JSON.stringify(body)
  });
  const data=await resp.json();
  if(data.code) throw new Error(data.message||'图像编辑请求失败');
  const taskId=data.output?.task_id;
  if(!taskId) throw new Error('未获取到任务ID');
  // Poll for result
  return await pollTaskResult(taskId);
}

// Poll async task until completion
async function pollTaskResult(taskId){
  const maxAttempts=30;
  for(let i=0;i<maxAttempts;i++){
    await new Promise(r=>setTimeout(r,3000));
    const resp=await fetch('https://dashscope.aliyuncs.com/api/v1/tasks/'+taskId,{
      headers:{ 'Authorization':'Bearer '+state.aiImage.apiKey }
    });
    const data=await resp.json();
    const status=data.output?.task_status;
    if(status==='SUCCEEDED'){
      const imageUrl=data.output?.results?.[0]?.url;
      if(!imageUrl) throw new Error('未获取到结果图片');
      return imageUrl;
    }
    if(status==='FAILED') throw new Error(data.output?.message||'图像编辑失败');
  }
  throw new Error('处理超时，请重试');
}

// Download and process result image through our polaroid filter
async function downloadAndProcessAI(imageUrl){
  const resp=await fetch(imageUrl);
  const blob=await resp.blob();
  const dataUrl=await new Promise((resolve)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.readAsDataURL(blob); });
  return new Promise((resolve)=>{
    processCatImage(dataUrl, (processed)=>resolve(processed));
  });
}

/* ---------- Image processor: center-crop + subtle warm tone ---------- */
function processCatImage(dataUrl, callback){
  const img=new Image();
  img.onload=()=>{
    const size=300;
    const canvas=document.createElement('canvas');
    canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext('2d');

    // step 1: center-crop to square
    const minDim=Math.min(img.width, img.height);
    const sx=(img.width-minDim)/2, sy=(img.height-minDim)/2;
    ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);

    // step 2: very subtle warm overlay (multiply) — light beige tint only
    ctx.globalCompositeOperation='multiply';
    ctx.fillStyle='rgba(255, 240, 225, 0.12)';
    ctx.fillRect(0, 0, size, size);

    // step 3: subtle vignette
    ctx.globalCompositeOperation='source-over';
    const grad=ctx.createRadialGradient(size/2, size/2, size*0.38, size/2, size/2, size*0.72);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(61,44,30,0.10)');
    ctx.fillStyle=grad;
    ctx.fillRect(0, 0, size, size);

    callback(canvas.toDataURL('image/jpeg', 0.85));
  };
  img.onerror=()=>{ toast('图片加载失败','error'); };
  img.src=dataUrl;
}

    selectedUrl=null;
    confirmBtn.disabled=true;

        gridHtml+=`<div class="sm-grid-item" data-url="${esc(r.url)}"><img src="${esc(r.thumb)}" alt="${esc(r.title)}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`;

      content.innerHTML=gridHtml;

      content.querySelectorAll('.sm-grid-item').forEach(item=>{
        item.onclick=()=>{
          content.querySelectorAll('.sm-grid-item').forEach(i=>i.classList.remove('selected'));
          item.classList.add('selected');
          selectedUrl=item.dataset.url;
          confirmBtn.disabled=false;
        };
      });
      // XHS search button
      const xhsBtn=content.querySelector('#smXhs');
      if(xhsBtn){
        xhsBtn.onclick=()=>window.open('https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(query),'_blank');
      }
    }catch(e){
      let msg=e.message||'搜索失败';
      content.innerHTML='<div class="sm-empty">'+msg+'<br><br>可以尝试：<br>1. 换一个关键词<br>2. <a href="https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(query)+'" target="_blank" style="color:var(--brand)">在小红书中搜索</a> 并手动上传</div>';
    }finally{
      searchBtn.disabled=false;
    }
  }

  // Search button
  searchBtn.onclick=()=>{ const q=input.value.trim(); if(q) doSearch(q); };
  input.onkeydown=(e)=>{ if(e.key==='Enter'){ const q=input.value.trim(); if(q) doSearch(q); } };

  // Confirm → generate
  confirmBtn.onclick=async()=>{
    if(!selectedUrl) return;
    confirmBtn.disabled=true;
    // Show generation overlay
    const genOverlay=document.createElement('div');
    genOverlay.className='sm-gen-overlay';
    genOverlay.innerHTML='<div class="spinner"></div><div class="sm-gen-text">正在生成统一风格图片...<br>保留食物主体，调整光影色调（约15秒）</div>';
    overlay.querySelector('.sm-sheet').style.position='relative';
    overlay.querySelector('.sm-sheet').appendChild(genOverlay);
    try{
      await onConfirm(selectedUrl);
      overlay.remove();
      toast('AI 风格化成功','success');
    }catch(e){
      let msg=e.message||'生成失败';
      if(msg.includes('Failed to fetch')||msg.includes('NetworkError')) msg='网络错误，请检查网络连接';
      else if(msg.includes('401')||msg.includes('Unauthorized')) msg='API Key 无效';
      else if(msg.includes('429')) msg='请求过于频繁，请稍后再试';
      toast('生成失败：'+msg,'error');
      genOverlay.remove();
      confirmBtn.disabled=false;
    }
  };

  // Auto-search on open
  doSearch(initialQuery);
}

/* ---------- Category editor modal (add / edit) ---------- */
function openCatEditor(existing){

  let name=existing?existing.name:'';
  let image=existing?existing.image:'';

  modal.innerHTML=`<div class="cat-modal">
    <div class="cm-body">
      <div class="cm-title">${isEdit?'编辑分类':'新建分类'}</div>
      <div class="cm-label">分类图片</div>
      <div class="cm-upload ${image?'has-img':''}" id="cmUpload">
        ${image?`<img src="${image}" alt="">`:''}
        <svg class="up-icon" viewBox="0 0 24 24"><path d="M12 20V8M7 13l5-5 5 5"/><path d="M5 20h14"/></svg>
        <span class="up-text">${image?'':'点击上传图片'}</span>
        ${image?`<span class="up-change">更换图片</span>`:''}
      </div>
      <div class="cm-label" style="margin-top:14px">分类名称</div>
      <input class="cm-input" id="cmName" value="${esc(name)}" placeholder="输入分类名称" maxlength="20">
    </div>
    <div class="cm-actions">
      <button class="mb-cancel" id="cmCancel">取消</button>
      <button class="mb-ok" id="cmOk" style="background:var(--brand)">${isEdit?'保存':'创建'}</button>
    </div>
  </div>`;
  modal.classList.add('show');

  const uploadArea=document.getElementById('cmUpload');
  const nameInput=document.getElementById('cmName');
  const imgInput=document.getElementById('catImgInput');

  // image upload — process to match default style (square crop + warm tone)
  uploadArea.onclick=()=>imgInput.click();

/* ---------- Editor with autosave ---------- */
let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(commitSave,1500); }
function commitSave(){
  const r=state.recipes.find(x=>x.id===state.recipeId);
  if(!r) return;
  // read from DOM
  const ne=document.getElementById('edName'); if(ne){ r.name=ne.value||'未命名配方'; }
  const sc=document.getElementById('edCat'); if(sc){ r.cat=sc.value; }
  const rows=document.querySelectorAll('.ing-row');
  r.ingredients=[];
  rows.forEach(row=>{
    const nm=row.querySelector('.in-name').value.trim();
    const gr=row.querySelector('.in-gram').value.trim();
    if(nm||gr) r.ingredients.push({name:nm,gram:gr});
  });
  const st=document.getElementById('edSteps'); if(st){ r.steps=st.value; }
  const no=document.getElementById('edNotes'); if(no){ r.notes=no.value; }
  r.updated=Date.now();
  persist(false);
}
function saveNow(){ clearTimeout(saveTimer); commitSave(); }

/* ---------- Tab 3: Baking Wiki (editable) ---------- */
let wikiSaveTimer=null;
let wikiSelected=new Set(); // indices of selected items in current category
let recipeSelected=new Set(); // ids of selected recipes in current category list
let catSelected=new Set(); // ids of selected categories for deletion

function scheduleWikiSave(){
  clearTimeout(wikiSaveTimer);
  wikiSaveTimer=setTimeout(commitWikiSave,1500);
}
function commitWikiSave(){
  const cat=state.wikiCat;
  const data=state.wiki[cat]; if(!data) return;
  const cards=document.querySelectorAll('.wiki-card-edit');
  data.items=[];
  cards.forEach(card=>{
    const n=card.querySelector('.wk-name').value.trim();
    const d=card.querySelector('.wk-desc').value.trim();
    if(n||d) data.items.push({n,d});
  });
  persist(true);
}
function saveWikiNow(){ clearTimeout(wikiSaveTimer); commitWikiSave(); }

function renderWiki(){
  const cats=Object.keys(state.wiki);
  const active=state.wikiCat||cats[0];
  const data=state.wiki[active];
  if(!data){ content.innerHTML='<div class="screen"><div class="empty">暂无数据</div></div>'; return; }
  wikiSelected.clear();
  const selCount=()=>wikiSelected.size;

  content.innerHTML=`
    <div class="screen">
      <div class="hd">
        <div class="hd-row">
          <div>
            <h1>烘焙百科</h1>
            <p>每种食材都有它的故事</p>
          </div>
          <div class="hd-actions">
            <button class="hd-btn brand" id="wikiAdd">${svg('plus',2)}</button>
            <button class="hd-btn danger" id="wikiDel">${svg('trash')}</button>
          </div>
        </div>
      </div>
      <div class="wiki-tabs">
        ${cats.map(c=>`<button class="wtab ${c===active?'on':''}" data-wcat="${c}">${c}</button>`).join('')}
      </div>
      <div class="wiki-grid" id="wikiGrid">
        ${data.items.map((it,i)=>wikiCardHTML(it,i,data.icon)).join('')}
      </div>
    </div>`;

  // tab switching
  document.querySelectorAll('.wtab').forEach(b=>{
    b.onclick=()=>{ saveWikiNow(); state.wikiCat=b.dataset.wcat; renderWiki(); };
  });

  // add — chooser: category or item
  document.getElementById('wikiAdd').onclick=()=>{
    openActionSheet('添加','请选择添加类型',[
      {label:'添加分类',variant:'brand',action:()=>{
        const name=prompt('输入新分类名称：');
        if(!name||!name.trim()) return;
        name=name.trim();
        if(state.wiki[name]){ toast('该分类已存在','error'); return; }
        state.wiki[name]={icon:'spice',items:[]};
        state.wikiCat=name;
        persist(true);
        renderWiki();
        toast('已添加分类：'+name,'success');
      }},
      {label:'添加食材',action:()=>{
        clearTimeout(wikiSaveTimer);
        const cat=state.wikiCat||Object.keys(state.wiki)[0];
        const cur=state.wiki[cat];
        if(!cur){ toast('数据异常，无法添加','error'); return; }
        if(!cur.items) cur.items=[];
        cur.items.unshift({n:'',d:''});
        renderWiki();
        window.scrollTo({top:0, behavior:'smooth'});
        setTimeout(()=>{
          const firstCard=document.querySelector('#wikiGrid .wiki-card-edit');
          if(firstCard){
            firstCard.querySelector('.wk-name').focus();
            firstCard.style.transition='box-shadow .4s ease';
            firstCard.style.boxShadow='0 0 0 2px var(--brand), 0 4px 14px rgba(139,111,78,.25)';
            setTimeout(()=>{ firstCard.style.boxShadow=''; }, 1500);
          }
          persist(true);
          toast('已添加新行','success');
        }, 100);
      }},
      {label:'取消'},
    ]);
  };

  // delete — chooser: category or selected items
  document.getElementById('wikiDel').onclick=()=>{
    const hasSel=wikiSelected.size>0;
    const opts=[
      {label:'删除当前分类',variant:'danger',action:()=>{
        const cats=Object.keys(state.wiki);
        if(cats.length<=1){ toast('至少保留一个分类','error'); return; }
        const cur=state.wikiCat||cats[0];
        openModal('删除分类？',`确认删除分类「${cur}」及其所有食材？此操作无法撤销。`,()=>{
          delete state.wiki[cur];
          state.wikiCat=Object.keys(state.wiki)[0];
          persist(true);
          renderWiki();
          toast('已删除分类：'+cur,'success');
        });
      }},
    ];
    if(hasSel){
      opts.push({label:`删除选中食材(${wikiSelected.size})`,variant:'danger',action:()=>{
        openModal('删除选中的食材？',`确认删除选中的 ${wikiSelected.size} 项食材？此操作无法撤销。`,()=>{
          const indices=Array.from(wikiSelected).sort((a,b)=>b-a);
          indices.forEach(idx=>{ data.items.splice(idx,1); });
          saveWikiNow();
          renderWiki();
          toast('已删除选中食材','success');
        });
      }});
    }
    opts.push({label:'取消'});
    openActionSheet('删除','请选择删除类型',opts);

  // auto-save on input
  document.querySelectorAll('.wk-name, .wk-desc').forEach(el=>{

  });

  document.querySelectorAll('.wk-check').forEach(cb=>{

  // (moved to wikiAdd action sheet above)

  // delete selected — (moved to wikiDel action sheet above)

  function updateWikiDelBtn(){
    const btn=document.getElementById('wikiDel');
    if(btn) btn.disabled = false; // always enabled: category delete is always available
  }
}

/* ---------- Memo (local only, NOT synced) ---------- */
const MEMO_KEY='recipe-atelier-memos';
function loadMemos(){
  try{ return JSON.parse(localStorage.getItem(MEMO_KEY))||[]; }catch(e){ return []; }
}
function saveMemos(memos){
  localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
}
function initMemo(){
  const listEl=document.getElementById('memoList');
  const addBtn=document.getElementById('memoAdd');
  if(!listEl||!addBtn) return;
  let memos=loadMemos();

  function renderList(){
    if(!memos.length){
      listEl.innerHTML='<div class="memo-empty">点击 + 添加备忘<br><br>记录你的烘焙灵感<br>配方调整笔记、购物清单...</div>';
      return;
    }
    listEl.innerHTML=memos.map((m,i)=>`
      <div class="memo-item" data-idx="${i}">
        <textarea rows="1" placeholder="输入备忘内容..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(m)}</textarea>
        <button class="memo-del" data-del="${i}">✕</button>
      </div>`).join('');
    // Auto-resize textareas
    listEl.querySelectorAll('textarea').forEach(ta=>{
      ta.style.height='auto';
      ta.style.height=ta.scrollHeight+'px';
    });
    // Bind events
    listEl.querySelectorAll('textarea').forEach((ta,i)=>{
      ta.onblur=()=>{ memos[i]=ta.value; saveMemos(memos); };
    });
    listEl.querySelectorAll('.memo-del').forEach(btn=>{
      btn.onclick=()=>{
        const idx=parseInt(btn.dataset.del);
        memos.splice(idx,1);
        saveMemos(memos);
        renderList();
      };
    });
  }

  addBtn.onclick=()=>{
    memos.push('');
    saveMemos(memos);
    renderList();
    // Focus the newly added textarea
    setTimeout(()=>{
      const last=listEl.querySelector('.memo-item:last-child textarea');
      if(last) last.focus();
    },50);
  };

  renderList();
}

function renderProfile(){
  const totalRecipes=state.recipes.length;
  const totalShowcases=(state.showcases||[]).length;
  const connected=syncConfigured();
  const backend=syncBackend();

function exportData(){
  const data={ version:1, exportedAt:new Date().toISOString(), recipes:state.recipes, pantry:state.pantry };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='recipe-atelier-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('✓ 备份已导出','success');
}
document.getElementById('fileImport').onchange=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d.recipes) throw new Error('no recipes');
      openModal('导入备份？','这将用文件内容替换当前所有配方和食材库。',()=>{
        state.recipes=d.recipes; state.pantry=d.pantry||[]; state.categories=d.categories||state.categories;
        persist(true); render(); toast('✓ 备份已导入','success');
      });
    }catch(err){ toast('导入失败：文件无效','error'); }
    e.target.value='';
  };
  reader.readAsText(file);
};

/* ---------- Mobile: scroll input into view on focus (global delegated) ---------- */
// Delegated so it survives every re-render. Waits for the soft keyboard to rise.
let _focusHandlerBound=false;
function bindGlobalFocusScroll(){
  if(_focusHandlerBound) return;
  _focusHandlerBound=true;
  document.addEventListener('focusin',(e)=>{
    const el=e.target;
    if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT')){
      setTimeout(()=>{ el.scrollIntoView({behavior:'smooth',block:'center'}); },320);
    }
  },true);
}

/* ---------- Phone Auth & Device Management ---------- */
// 配置: 部署阿里云FC函数后，将URL填入此处
const FC_API_URL='https://recipe-auth-qfcvanmdxp.cn-beijing.fcapp.run';
const AUTH_KEY='auth_state';
const DEVICE_ID_KEY='device_id';
// 管理员手机号 — 只有这些手机号登录后才能看到设备管理库
const ADMIN_PHONES=['15057892820'];
function isAdminPhone(){
  const auth=getAuthState();
  return ADMIN_PHONES.includes(auth.phone);
}

function getDeviceId(){
  let id=localStorage.getItem(DEVICE_ID_KEY);
  if(!id){
    id='dev-'+Date.now().toString(36)+'-'+Math.random().toString(36).substr(2,8);
    localStorage.setItem(DEVICE_ID_KEY,id);
  }
  return id;
}
function getDeviceInfo(){
  const ua=navigator.userAgent;
  let platform='Unknown',name='未知设备';
  if(/iPhone/.test(ua)){platform='iOS';name='iPhone';}
  else if(/iPad/.test(ua)){platform='iOS';name='iPad';}
  else if(/Android/.test(ua)){platform='Android';name='Android设备';}
  else if(/Windows/.test(ua)){platform='Windows';name='Windows电脑';}
  else if(/Macintosh/.test(ua)){platform='macOS';name='Mac电脑';}
  return{name,platform,userAgent:ua};
}
function getAuthState(){
  try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'{}');}catch(e){return{};}
}
function setAuthState(s){localStorage.setItem(AUTH_KEY,JSON.stringify(s));}
function clearAuthState(){localStorage.removeItem(AUTH_KEY);}

async function callBackend(action,data){
  if(!FC_API_URL) throw new Error('后端服务未配置');
  const res=await fetch(FC_API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,...data})
  });
  return res.json();
}

async function checkDeviceLock(){
  const auth=getAuthState();
  if(!auth.phone||!auth.token) return false;
  try{
    const url=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json?access_token='+encodeURIComponent(auth.token);
    const res=await fetch(url);
    if(!res.ok) return false;
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content)));
    const users=JSON.parse(content);
    const user=users.find(u=>u.phone===auth.phone);
    if(!user) return false;
    const dev=(user.devices||[]).find(d=>d.deviceId===getDeviceId());
    return !!(dev&&dev.locked);
  }catch(e){return false;}
}

async function getDevicesList(){
  const auth=getAuthState();
  if(!auth.phone||!auth.token) return[];
  try{
    const url=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json?access_token='+encodeURIComponent(auth.token);
    const res=await fetch(url);
    if(!res.ok) return[];
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content)));
    const users=JSON.parse(content);
    // Admin: return ALL devices from ALL users
    const allDevices=[];
    users.forEach(u=>{
      (u.devices||[]).forEach(d=>{
        allDevices.push({...d, phone:u.phone});
      });
    });
    return allDevices;
  }catch(e){return[];}
}

async function lockUnlockDevice(deviceId,locked){
  const auth=getAuthState();
  if(!auth.phone||!auth.token) return false;
  try{
    const url=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json?access_token='+encodeURIComponent(auth.token);
    const res=await fetch(url);
    if(!res.ok) return false;
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content)));
    const users=JSON.parse(content);
    // Search across ALL users to find the device
    let found=false;
    users.forEach(u=>{
      const dev=(u.devices||[]).find(d=>d.deviceId===deviceId);
      if(dev){ dev.locked=locked; found=true; }
    });
    if(!found) return false;
    const newContent=btoa(unescape(encodeURIComponent(JSON.stringify(users,null,2))));
    const updateUrl=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json';
    const updateRes=await fetch(updateUrl,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({access_token:auth.token,content:newContent,sha:data.sha,message:'Update device lock'})
    });
    return updateRes.ok;
  }catch(e){return false;}
}

async function deleteDevice(deviceId){
  const auth=getAuthState();
  if(!auth.phone||!auth.token) return false;
  try{
    const url=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json?access_token='+encodeURIComponent(auth.token);
    const res=await fetch(url);
    if(!res.ok) return false;
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content)));
    const users=JSON.parse(content);
    let found=false;
    users.forEach(u=>{
      const before=(u.devices||[]).length;
      u.devices=(u.devices||[]).filter(d=>d.deviceId!==deviceId);
      if(u.devices.length<before) found=true;
    });
    if(!found) return false;
    const newContent=btoa(unescape(encodeURIComponent(JSON.stringify(users,null,2))));
    const updateUrl=GITEE_API+'/repos/'+auth.giteeOwner+'/'+auth.giteeRepo+'/contents/users.json';
    const updateRes=await fetch(updateUrl,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({access_token:auth.token,content:newContent,sha:data.sha,message:'Delete device record'})
    });
    return updateRes.ok;
  }catch(e){return false;}
}

function bindDeviceSwipeDelete(listEl){
  const DELETE_WIDTH=76;
  let activeSwipe=null;
  // Close all swipes
  function closeAllSwipes(except){
    listEl.querySelectorAll('.device-swipe-content.swiped').forEach(el=>{
      if(el!==except){ el.classList.remove('swiped'); }
    });
  }
  // Touch handlers
  listEl.querySelectorAll('.device-swipe-content').forEach(content=>{
    let startX=0,startY=0,currentX=0,dragging=false,lockedDir=false,isHorizontal=false;
    content.addEventListener('touchstart',e=>{
      if(content.classList.contains('current')) return;
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      currentX=content.classList.contains('swiped')?-DELETE_WIDTH:0;
      dragging=true; lockedDir=false; isHorizontal=false;
      content.classList.add('dragging');
      // Close other swipes
      closeAllSwipes(content);
      activeSwipe=content;
    },{passive:true});
    content.addEventListener('touchmove',e=>{
      if(!dragging||content.classList.contains('current')) return;
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(!lockedDir){
        if(Math.abs(dx)>8||Math.abs(dy)>8){
          isHorizontal=Math.abs(dx)>Math.abs(dy);
          lockedDir=true;
        }
      }
      if(isHorizontal){
        let newX=currentX+dx;
        if(newX>0) newX=0;
        if(newX<-DELETE_WIDTH) newX=-DELETE_WIDTH;
        content.style.transform='translateX('+newX+'px)';
      }
    },{passive:true});
    content.addEventListener('touchend',e=>{
      if(!dragging||content.classList.contains('current')) return;
      dragging=false;
      content.classList.remove('dragging');
      const dx=e.changedTouches[0].clientX-startX;
      if(!isHorizontal){
        content.style.transform='';
        return;
      }
      const threshold=DELETE_WIDTH/2;
      const shouldOpen=(currentX+dx)<-threshold||dx<-threshold;
      if(shouldOpen){
        content.classList.add('swiped');
        content.style.transform='';
        activeSwipe=content;
      }else{
        content.classList.remove('swiped');
        content.style.transform='';
      }
    },{passive:true});
  });
  // Click delete button
  listEl.querySelectorAll('.device-swipe-delete').forEach(btn=>{
    btn.onclick=()=>{
      const deviceId=btn.dataset.id;
      const deviceName=btn.dataset.name;
      openModal('删除设备记录？','将永久删除「'+deviceName+'」的登录记录，该设备下次需要重新登录。',async()=>{
        btn.disabled=true;
        const ok=await deleteDevice(deviceId);
        if(ok){
          toast('设备记录已删除','success');
          renderProfile();
        }else{
          toast('删除失败，请重试','error');
          btn.disabled=false;
        }
      });
    };
  });
  // Click outside to close swipes
  document.addEventListener('click',e=>{
    if(activeSwipe&&!e.target.closest('.device-swipe-wrap')){
      activeSwipe.classList.remove('swiped');
      activeSwipe=null;
    }
  },{passive:true});
}

let _pnvsSDK=null;
function loadNumberAuthSDK(){
  if(_pnvsSDK) return Promise.resolve(_pnvsSDK);
  if(window.PhoneNumberServer){
    _pnvsSDK=new window.PhoneNumberServer();
    return Promise.resolve(_pnvsSDK);
  }
  const urls=[
    'https://unpkg.com/aliyun_numberauthsdk_web@2.1.15/',
    'https://cdn.jsdelivr.net/npm/aliyun_numberauthsdk_web@2.1.15/'
  ];
  let idx=0;
  function tryLoad(){
    if(idx>=urls.length) return Promise.reject(new Error('SDK加载失败'));
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=urls[idx++];
      s.onload=()=>{
        if(window.PhoneNumberServer){
          _pnvsSDK=new window.PhoneNumberServer();
          resolve(_pnvsSDK);
        }else{
          s.remove();
          tryLoad().then(resolve).catch(reject);
        }
      };
      s.onerror=()=>{ s.remove(); tryLoad().then(resolve).catch(reject); };
      document.head.appendChild(s);
    });
  }
  return tryLoad();
}

async function tryOneClickLogin(msgEl,overlay){
  if(!FC_API_URL){ msgEl.textContent='后端服务未配置，请使用密码或验证码登录'; return; }
  msgEl.textContent='正在初始化一键登录…';
  try{
    const sdk=await loadNumberAuthSDK();
    const netType=sdk.getConnection?sdk.getConnection():'unknown';
    if(netType==='wifi'){
      msgEl.textContent='一键登录需使用移动数据，请关闭WiFi后重试，或使用验证码登录';
      return;
    }
    const tokenRes=await callBackend('getAuthToken',{
      url:window.location.href.split('#')[0],
      origin:window.location.origin
    });
    if(!tokenRes.success){
      msgEl.textContent=tokenRes.error||'获取认证Token失败';
      return;
    }
    sdk.checkLoginAvailable({
      accessToken:tokenRes.accessToken,
      jwtToken:tokenRes.jwtToken,
      success:function(res){
        if(res.code!==600000){
          msgEl.textContent='一键登录不可用，请使用验证码登录';
          return;
        }
        sdk.getLoginToken({
          authPageOption:{
            navText:'本机号码登录',
            btnText:'一键登录',
            isDialog:true,
            manualClose:true,
            privacyBefore:'我已阅读并同意',
            privacyOne:['《用户协议》',''],
            privacyTwo:['《隐私政策》',''],
            showCustomView:true,
            customView:{
              element:'<div class="pnvs_other" id="pnvsOtherLogin">切换其他登录方式</div>',
              style:'.pnvs_other{background:#fff;color:#C48C5C;text-align:center;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;margin-top:8px}',
              js:'document.getElementById("pnvsOtherLogin").onclick=function(){if(window._pnvsSDK)window._pnvsSDK.closeLoginPage();}'
            }
          },
          success:async function(res){
            if(res.code!==600000){
              msgEl.textContent=res.msg||'获取登录Token失败';
              return;
            }
            try{
              const phoneRes=await callBackend('getPhone',{
                spToken:res.spToken,
                deviceId:getDeviceId(),
                deviceInfo:getDeviceInfo()
              });
              if(phoneRes.success){
                sdk.closeLoginPage();
                setAuthState({phone:phoneRes.phone,token:phoneRes.token,giteeOwner:phoneRes.giteeOwner,giteeRepo:phoneRes.giteeRepo});
                state.sync.giteeToken=phoneRes.token;
                state.sync.giteeRepo=phoneRes.giteeOwner+'/'+phoneRes.giteeRepo;
                state.sync.giteeOwner=phoneRes.giteeOwner;
                writeLocal();
                overlay.remove();
                syncPull(true).then(()=>{render();}).catch(()=>{});
                render();
              }else{
                msgEl.textContent=phoneRes.error||'一键登录失败';
                if(phoneRes.deviceLocked) showDeviceLockedScreen();
              }
            }catch(e){ msgEl.textContent='网络错误'; }
          },
          error:function(res){ msgEl.textContent='授权取消或失败，请使用验证码登录'; },
          watch:function(status,data){ if(status===2) msgEl.textContent=''; }
        });
      },
      error:function(res){
        msgEl.textContent='一键登录不可用（可能处于WiFi网络），请使用验证码登录';
      }
    });
  }catch(e){
    msgEl.textContent='SDK加载失败，请使用验证码登录';
  }
}

        btn.disabled=false;btn.textContent=btnText;
      }
    }catch(e){
      msg.textContent='网络错误或后端未配置';
      btn.disabled=false;btn.textContent=btnText;
    }
  }

  document.getElementById('pwdLoginBtn').onclick=()=>{
    const phone=document.getElementById('loginPhone').value.trim();
    const pwd=document.getElementById('loginPassword').value;
    if(!phone||!pwd){msg.textContent='请输入手机号和密码';return;}
    doLogin('login',phone,{password:pwd},document.getElementById('pwdLoginBtn'),'登 录');
  };
  document.getElementById('codeLoginBtn').onclick=()=>{
    const phone=document.getElementById('codeLoginPhone').value.trim();
    const code=document.getElementById('codeLoginCode').value.trim();
    if(!phone||!code){msg.textContent='请输入手机号和验证码';return;}
    doLogin('loginByCode',phone,{code},document.getElementById('codeLoginBtn'),'登 录');
  };

  document.getElementById('registerBtn').onclick=async()=>{
    const phone=document.getElementById('regPhone').value.trim();
    const code=document.getElementById('regCode').value.trim();
    const pwd=document.getElementById('regPassword').value;
    if(!phone||!code||!pwd){msg.textContent='请填写完整信息';return;}
    if(pwd.length<6){msg.textContent='密码至少6位';return;}
    const btn=document.getElementById('registerBtn');
    btn.disabled=true;btn.textContent='注册中...';msg.textContent='';
    try{
      const res=await callBackend('register',{phone,code,password:pwd});
      if(res.success){
        // Auto-login after registration
        const loginRes=await callBackend('login',{phone,password:pwd,deviceId:getDeviceId(),deviceInfo:getDeviceInfo()});
        if(loginRes.success){
          setAuthState({phone:loginRes.phone,token:loginRes.token,giteeOwner:loginRes.giteeOwner,giteeRepo:loginRes.giteeRepo});
          state.sync.giteeToken=loginRes.token;
          state.sync.giteeRepo=loginRes.giteeOwner+'/'+loginRes.giteeRepo;
          state.sync.giteeOwner=loginRes.giteeOwner;
          writeLocal();
          overlay.remove();
          syncPull(true).then(()=>{render();}).catch(()=>{});
          render();
        }else{
          msg.textContent='注册成功，请登录';
          switchForm('loginForm');
          document.getElementById('loginPhone').value=phone;
          btn.disabled=false;btn.textContent='注 册';
        }
      }else{
        msg.textContent=res.error||'注册失败';
        btn.disabled=false;btn.textContent='注 册';
      }
    }catch(e){
      msg.textContent='网络错误或后端未配置';
      btn.disabled=false;btn.textContent='注 册';
    }
  };

  document.getElementById('loginPassword').addEventListener('keydown',(e)=>{if(e.key==='Enter')document.getElementById('pwdLoginBtn').click();});
  document.getElementById('regPassword').addEventListener('keydown',(e)=>{if(e.key==='Enter')document.getElementById('registerBtn').click();});
}
function logout(){
  clearAuthState();
  disconnectSync();
  localStorage.removeItem(GALLERY_LOCK_KEY);
  showAuthScreen();
}
bindGlobalFocusScroll();
load();
// Auto-repair garbled text from previous encoding bug
const bootRepaired = repairAllData();
// Fix giteeRepo format: ensure it's "owner/repo" not just "repo"
if(state.sync.giteeOwner && state.sync.giteeRepo && !state.sync.giteeRepo.includes('/')){
  state.sync.giteeRepo = state.sync.giteeOwner + '/' + state.sync.giteeRepo;
  writeLocal();
}
// check URL for sync config (device pairing via link)
const urlSyncApplied = checkUrlForSyncConfig();
// Check login status — show auth screen if not logged in
if(!isLoggedIn()){
  showAuthScreen();
}else{
  // Logged in — check if current device is locked
  checkDeviceLock().then(locked=>{
    if(locked){
      showDeviceLockedScreen();
    }
  });
}
render();
if(bootRepaired){
  toast('已自动修复乱码数据','success');
}
if(urlSyncApplied){
  toast('✓ 已从链接自动配置同步','success');
}
// background pull on startup so a new device fetches cloud data
if(syncConfigured()){
  syncPull(true).then(()=>{
    if(state.sync.localUpdatedAt > state.sync.lastSyncedAt) syncPush(true);
  });
}
// pull when the tab regains focus or becomes visible again (cross-device freshness)
let lastPullTs=0;
async function maybePullOnFocus(){
  if(!syncConfigured()) return;
  const now=Date.now();
  if(now - lastPullTs < 10000) return; // throttle: at most once per 10s
  lastPullTs=now;
  await syncPull(true);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) maybePullOnFocus(); });
window.addEventListener('focus', maybePullOnFocus);
// periodic cloud poll every 30s for cross-device sync (catches updates even without focus events)
if(syncConfigured()){
  setInterval(()=>{ if(!document.hidden) maybePullOnFocus(); }, 30000);
}

// ---------- Gallery Password Lock ----------
// (constants & isGalleryUnlocked moved to Boot section above)

function renderGalleryLock(){
  const existing=document.getElementById('lockOverlay');
  if(existing) existing.remove();
  const overlay=document.createElement('div');
  overlay.className='lock-overlay';
  overlay.id='lockOverlay';
  overlay.innerHTML=`
    <div class="lock-bg-decor" id="lockBgDecor"></div>
    <div class="lock-body" id="lockBody">
      <div class="lock-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="lock-title">Recipe Gallery</div>
      <div class="lock-subtitle">输入密码，开启甜蜜配方</div>
      <div class="pin-display" id="pinDisplay">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="num-pad" id="numPad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="num-btn" data-num="${n}">${n}</button>`).join('')}
        <button class="num-btn fn" id="numClear">清除</button>
        <button class="num-btn" data-num="0">0</button>
        <button class="num-btn fn confirm" id="numConfirm">♥</button>
      </div>
      <div class="lock-msg-bubble" id="lockMsg"></div>
    </div>`;
  document.body.appendChild(overlay);

  // === Generate dreamy background decorations ===
  const bgDecor=document.getElementById('lockBgDecor');
  // Transparent bubbles rising
  for(let i=0;i<12;i++){
    const b=document.createElement('div');
    b.className='lock-bubble';
    const sz=20+Math.random()*50;
    b.style.width=sz+'px'; b.style.height=sz+'px';
    b.style.left=Math.random()*100+'%';
    b.style.animationDuration=(10+Math.random()*15)+'s';
    b.style.animationDelay=Math.random()*10+'s';
    bgDecor.appendChild(b);
  }
  // Falling flower petals
  const petals=['🌸','🌺','🌷','💮'];
  for(let i=0;i<8;i++){
    const p=document.createElement('div');
    p.className='lock-petal';
    p.textContent=petals[Math.floor(Math.random()*petals.length)];
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*8)+'s';
    p.style.animationDelay=Math.random()*8+'s';
    p.style.fontSize=(14+Math.random()*8)+'px';
    bgDecor.appendChild(p);
  }
  // Twinkling sparkles
  for(let i=0;i<15;i++){
    const s=document.createElement('div');
    s.className='lock-sparkle';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDuration=(2+Math.random()*3)+'s';
    s.style.animationDelay=Math.random()*3+'s';
    const sz=3+Math.random()*4;
    s.style.width=sz+'px'; s.style.height=sz+'px';
    bgDecor.appendChild(s);
  }

  // === PIN input logic ===
  let pinInput='';
  const pinDots=overlay.querySelectorAll('#pinDisplay .pin-dot');
  const pinDisplay=document.getElementById('pinDisplay');
  const lockMsg=document.getElementById('lockMsg');
  const lockBody=document.getElementById('lockBody');

  function updateDisplay(){
    pinDots.forEach((d,i)=>d.classList.toggle('filled',i<pinInput.length));
  }

  function tryUnlock(){
    if(pinInput===GALLERY_PASSWORD) unlockSuccess();
    else unlockFail();
  }

  function unlockSuccess(){
    const r=lockBody.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;

    // Heart glow expansion
    const glow=document.createElement('div');
    glow.className='heart-glow';
    glow.style.left=cx+'px'; glow.style.top=cy+'px';
    document.body.appendChild(glow);
    setTimeout(()=>glow.remove(),1000);

    // Screen brighten flash
    const brighten=document.createElement('div');
    brighten.className='success-brighten';
    document.body.appendChild(brighten);
    setTimeout(()=>brighten.remove(),800);

    // Burst hearts, petals & sparkles
    const hearts=['💕','💖','💗','💝','🌸','🌺','✨','⭐','🩷'];
    for(let i=0;i<35;i++){
      const p=document.createElement('div');
      p.style.cssText='position:fixed;font-size:'+(14+Math.random()*16)+'px;pointer-events:none;z-index:10001;left:'+cx+'px;top:'+cy+'px;transition:all '+(.8+Math.random()*.6)+'s cubic-bezier(.25,.46,.45,.94)';
      p.textContent=hearts[Math.floor(Math.random()*hearts.length)];
      document.body.appendChild(p);
      const ang=Math.random()*Math.PI*2;
      const dist=80+Math.random()*220;
      const dx=Math.cos(ang)*dist;
      const dy=Math.sin(ang)*dist-60;
      requestAnimationFrame(()=>{
        p.style.transform='translate('+dx+'px,'+dy+'px) scale(.3) rotate('+(Math.random()*360)+'deg)';
        p.style.opacity='0';
      });
      setTimeout(()=>p.remove(),1500);
    }

    // Save unlock state
    localStorage.setItem(GALLERY_LOCK_KEY,'true');

    // Melt away the lock overlay
    setTimeout(()=>{ overlay.classList.add('unlocking'); },600);

    // Show warm welcome message
    setTimeout(()=>{
      const welcome=document.createElement('div');
      welcome.className='welcome-banner';
      welcome.textContent='欢迎回来，甜蜜配方已为您准备好 ♡';
      document.body.appendChild(welcome);
      setTimeout(()=>welcome.remove(),1500);
    },800);

    // Reveal gallery content
    setTimeout(()=>{
      const sc=content.querySelector('.screen');
      if(sc) sc.classList.add('gallery-reveal');
    },1200);

    // Remove overlay after melt completes
    setTimeout(()=>{ overlay.remove(); },1600);
  }

  function unlockFail(){
    lockBody.classList.add('shake-sweet');
    pinDisplay.classList.add('error');
    lockMsg.textContent='哎呀，密码好像不对哦～';
    lockMsg.classList.add('show');

    setTimeout(()=>{
      lockBody.classList.remove('shake-sweet');
      pinDisplay.classList.remove('error');
      lockMsg.classList.remove('show');
    },1500);

    pinInput='';
    updateDisplay();
    setTimeout(()=>{ lockMsg.textContent=''; },1500);
  }

  overlay.querySelectorAll('#numPad .num-btn[data-num]').forEach(btn=>{
    btn.onclick=()=>{
      if(pinInput.length<4){
        pinInput+=btn.dataset.num;
        updateDisplay();
        if(pinInput.length===4) setTimeout(tryUnlock,250);
      }
    };
  });
  document.getElementById('numClear').onclick=()=>{
    pinInput=''; updateDisplay(); lockMsg.classList.remove('show'); lockMsg.textContent='';
  };
  document.getElementById('numConfirm').onclick=()=>{
    if(pinInput.length===4) tryUnlock();
  };
}

// ---------- PWA Service Worker Registration ----------
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // Check for SW updates every 60 seconds
    setInterval(()=>{ reg.update().catch(()=>{}); }, 60000);
  }).catch(()=>{});
  // When a new SW takes control, force reload to load new assets
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    // Prevent reload loop with a flag
    if(!sessionStorage.getItem('sw_reloaded')){
      sessionStorage.setItem('sw_reloaded','1');
      window.location.reload();
    }
  });
}

// ---------- Remote Version Check ----------
// Fetch latest sw.js from GitHub Pages to compare versions
// Uses github.io (accessible in China) instead of raw.githubusercontent.com (blocked)
const APP_VERSION='v53';
async function checkRemoteVersion(){
  try{
    // Try GitHub Pages first (accessible in China), fallback to raw.githubusercontent.com
    let res;
    try{
      res=await fetch('https://wangxuanchun.github.io/xiafei-workstation/sw.js?_t='+Date.now(),{cache:'no-store'});
    }catch(e1){
      // Fallback: try raw.githubusercontent.com (may work with VPN)
      res=await fetch('https://raw.githubusercontent.com/wangxuanchun/xiafei-workstation/main/sw.js?_t='+Date.now(),{cache:'no-store'});
    }
    if(!res || !res.ok) return;
    const text=await res.text();
    const m=text.match(/recipe-atelier-(v\d+)/);
    if(m && m[1] !== APP_VERSION){
      // Version mismatch — force clear everything and reload
      console.log('Version mismatch: local='+APP_VERSION+' remote='+m[1]+' — forcing update');
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        for(const r of regs) await r.unregister();
      }
      if('caches' in window){
        const keys=await caches.keys();
        for(const k of keys) await caches.delete(k);
      }
      sessionStorage.removeItem('sw_reloaded');
      window.location.reload(true);
    }
  }catch(e){ /* network error — skip */ }
}
// Check 3 seconds after page load
setTimeout(checkRemoteVersion, 3000);
// Check every 5 minutes
setInterval(checkRemoteVersion, 300000);
